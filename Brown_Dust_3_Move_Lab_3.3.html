<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Brown Dust 3 — Move Lab 3.3</title>
<style>
html,body{margin:0;height:100%;background:#1a1a22;overflow:hidden;font-family:monospace;color:#eee}
#c{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
/* LOADOUT = toggleable overlay; closed by default → full-screen arena */
#btnToggle{position:fixed;top:10px;right:10px;z-index:8;background:#2a3040;color:#ffe08a;border:1px solid #668;border-radius:8px;padding:10px 12px;font:bold 12px monospace;cursor:pointer;box-shadow:0 2px 8px #0008}
#btnToggle.open{background:#3a4860;border-color:#ffe08a}
#loadout{position:fixed;top:0;right:0;width:min(380px,92vw);height:100%;background:rgba(10,12,18,.96);border-left:1px solid #556;display:flex;flex-direction:column;z-index:7;backdrop-filter:blur(6px);box-shadow:-8px 0 24px #000a;transform:translateX(0);transition:transform .18s ease,opacity .18s ease}
#loadout.collapsed{transform:translateX(105%);opacity:0;pointer-events:none;width:min(380px,92vw);border:0;overflow:hidden}
#loadout .head{padding:10px 12px;border-bottom:1px solid #334;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
#loadout .head h1{font-size:13px;margin:0;color:#ffe08a;letter-spacing:.04em}
#btnCloseLoadout{background:#5a2030;color:#ffe8e0;border:2px solid #e08070;border-radius:8px;padding:8px 14px;font:bold 13px monospace;cursor:pointer;flex-shrink:0;letter-spacing:.04em}
#btnCloseLoadout:hover{background:#5a3040}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.chip{background:#1e2430;color:#ccd;border:1px solid #456;border-radius:999px;padding:4px 8px;font:bold 10px monospace;cursor:pointer}
.chip.on{background:#3a4860;color:#fff;border-color:#ffe08a}
#moveList{flex:1;overflow:auto;padding:6px 8px 20px;-webkit-overflow-scrolling:touch}
.mv{background:#181e28;border:1px solid #2a3344;border-radius:8px;padding:8px;margin:0 0 6px;cursor:pointer}
.mv:hover{border-color:#6a7a98}
.mv.on{border-color:#ffe08a;background:#243040}
.mv b{font-size:12px}
.mv .tag{font-size:9px;opacity:.7;margin-left:4px}
.mv small{color:#9ab;font-size:10px;line-height:1.3}
.mv .stat{color:#ffe08a;font-size:10px}
#portraits{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px}
.port{width:40px;height:40px;border-radius:50%;border:2px solid #456;background-size:cover;background-position:center;cursor:pointer;padding:0}
.port.on{border-color:#ffe08a;box-shadow:0 0 0 2px #ffe08a55}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 10px}
.bar button{background:#2a3548;color:#eef;border:1px solid #567;border-radius:6px;padding:6px 8px;font:bold 10px monospace;cursor:pointer}
.bar button:hover{background:#3a4a60}
#countLabel{font-size:11px;color:#8ab;white-space:nowrap}
@media (max-width:900px){
  #loadout{width:min(360px,94vw)}
  #btnToggle{top:8px;right:8px;padding:12px 14px;font-size:13px}
}
.mv .ln{font-size:10px;color:#cdd6e6;margin-top:3px;line-height:1.45}
.mv .st{color:#8fd0ff;font-weight:bold}.mv .br{color:#ffb070;font-weight:bold}.mv .ws{color:#ffe070;font-weight:bold}
.mv .ins{color:#b8a0e0;font-style:italic}
#loadout{width:min(440px,94vw)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btnToggle" type="button" aria-controls="loadout">LOADOUT</button>
<aside id="loadout" class="collapsed" aria-hidden="true">
  <div class="head">
    <h1>MOVE LAB 3.3</h1>
    <span id="countLabel"></span>
    <button id="btnCloseLoadout" type="button" title="Close loadout">✕ CLOSE</button>
  </div>
  <div id="portraits" title="Swap heroine portrait"></div>
  <div class="bar">
    <button id="btnW20" type="button">WAVE 20</button>
    <button id="btnW30" type="button">WAVE 30</button>
    <button id="btnW40" type="button">WAVE 40</button>
    <button id="btnArmored" type="button">ARMORED</button>
    <button id="btnDummy" type="button">DUMMIES</button>
    <button id="btnReset" type="button">RESET</button>
    <button id="btnMove" type="button">DUMMY MOVE</button>
    <button id="btnLow" type="button">LOW GFX</button>
    <button id="btnImpact" type="button">IMPACT</button>
    <button id="btnRoll" type="button">ROLL BUILD</button>
  </div>
  <div id="slotTabs" class="chips"></div>
  <div id="schoolFilters" class="chips"></div>
  <div id="moveList"></div>
</aside>

/* ---------- arena (fantasy) ---------- */
const T=48, AW=42, AH=28;
const ARENA_W=AW*T, ARENA_H=AH*T;
let grid=[], props=[], groundCv=null;
function genArena(){
  grid=[]; props=[];
  for(let y=0;y<AH;y++){
    grid[y]=[];
    for(let x=0;x<AW;x++){
      let v=0;
      if(x===0||y===0||x===AW-1||y===AH-1) v=1;
      else if(((x+y*3)%17)===0 && x>3&&y>3&&x<AW-4&&y<AH-4) v=1;
      else if(Math.hypot(x-AW/2,y-AH/2)<5) v=3;
      else if((x%9===4 && y>4 && y<AH-4) || (y%8===3 && x>4 && x<AW-4)) v=2;
      grid[y][x]=v;
    }
  }
  const spots=[[5,5],[8,21],[35,6],[36,22],[12,14],[29,17],[6,12],[38,14]];
  for(const[tx,ty] of spots){ if(grid[ty]&&grid[ty][tx]===0){ grid[ty][tx]=5; props.push({k:'tree',x:(tx+.5)*T,y:(ty+.5)*T}); } }
  buildGround();
}
function buildGround(){
  // pre-render static ground once (big tablet win vs 1176 fillRects/frame)
  groundCv = document.createElement('canvas');
  groundCv.width = ARENA_W; groundCv.height = ARENA_H;
  const g = groundCv.getContext('2d');
  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){
    const v=grid[y][x], px=x*T, py=y*T;
    if(v===1){ g.fillStyle='#5a5348'; g.fillRect(px,py,T,T); g.fillStyle='#3a342c'; g.fillRect(px+4,py+4,T-8,T-8); g.fillStyle='#6a6356'; g.fillRect(px+4,py+4,T-8,5); }
    else if(v===2){ g.fillStyle='#6b5a3e'; g.fillRect(px,py,T,T); g.fillStyle='#75644a'; g.fillRect(px+((x*7)%30),py+((y*11)%30),6,4); }
    else if(v===3){ g.fillStyle='#7a7260'; g.fillRect(px,py,T,T); g.strokeStyle='#4a4438'; g.strokeRect(px+2,py+2,T-4,T-4); }
    else { g.fillStyle = ((x+y)&1) ? '#3d6b34' : '#457a3c'; g.fillRect(px,py,T,T);
      g.fillStyle='#4f8a44'; if(((x*13+y*7)%5)===0) g.fillRect(px+10,py+18,3,7); }
  }
  // central rune circle
  g.strokeStyle='rgba(255,230,160,.25)'; g.lineWidth=3;
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,4.2*T,0,6.28); g.stroke();
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,3.2*T,0,6.28); g.stroke();
  for(const p of props){
    g.fillStyle='#2a4a20'; g.beginPath(); g.arc(p.x,p.y,20,0,6.28); g.fill();
    g.fillStyle='#5a3a18'; g.fillRect(p.x-4,p.y,8,14);
    g.fillStyle='#3d7a30'; g.beginPath(); g.arc(p.x,p.y-6,17,0,6.28); g.fill();
  }
}
function solidAt(x,y){
  const tx=Math.floor(x/T), ty=Math.floor(y/T);
  if(ty<0||tx<0||ty>=AH||tx>=AW) return true;
  const v=grid[ty][tx];
  if(v===1 || v===5) return true;
  for(const w of wallsTemp){ if(Math.abs(x-w.x)<w.hw && Math.abs(y-w.y)<w.hw) return true; }
  return false;
}
function walkOk(x,y,r){
  return !solidAt(x-r,y)&&!solidAt(x+r,y)&&!solidAt(x,y-r)&&!solidAt(x,y+r);
}

function tBtns(){
  const r = Math.max(30, Math.min(40, Math.min(W,H)*0.052));
  const cx = W - 90 - STICK_R - r - 26, cy = H - 100;
  const p = player, ms = p && p.set;

/* ---------- ragdoll (ported/simplified from Micro Rivals 7.3) ---------- */
const RAG_MAX_HARD=40;
const RAG_K=0.58, RAG_KL=0.46;
const ARMS={extended:[[12,13],[17,23]],bent:[[6,13],[14,7]],under:[[4,6],[-1,2]],tucked:[[2,8],[10,5]],side:[[0,12],[-8,12]]};
const LEGS={straight:[[-14,4],[-24,5],[-14,-4],[-24,-5]],onebent:[[-8,12],[-18,10],[-14,-4],[-24,-5]],bothbent:[[-6,9],[-16,4],[-6,-9],[-16,-4]],splayed:[[-13,7],[-21,12],[-13,-7],[-21,-12]]};

function liveSkel(u){

}
function ragBlock(x,y){ return solidAt(x,y); }
function pickPose(){
  const R=Math.random;
  return {aL:ARMK[(R()*ARMK.length)|0], aR:ARMK[(R()*ARMK.length)|0], legs:LEGK[(R()*LEGK.length)|0], tw:[-1,0,1][(R()*3)|0], hd:[-1,0,1][(R()*3)|0]};

function spawnRag(u, a, killPow){

  const v0=killPow*.68*(killPow>=600?1.4:1)*(.9+Math.random()*.2);

  const arm=(k,side)=>{const A=ARMS[k]; return A.map(([f,l])=>[f,l*side]);};

  const tw=c.tw*.3+(Math.random()-.5)*.15, ct=Math.cos(tw), st=Math.sin(tw);
  const rot=([f,l])=>[-4+(f+4)*ct-l*st,(f+4)*st+l*ct];
  let head=[16,c.hd*3.5], chest=[8,0];
  const loc=[rot(head),rot(chest),[-4,0],rot(aL[1]),rot(aR[1]),Lg[1],Lg[3],rot(aL[0]),rot(aR[0]),Lg[0],Lg[2]]
    .map(([f,l],k)=>{const K=k>2?RAG_KL:RAG_K; return[-4+(f+4)*K,l*K];});

  const pts=loc.map(([f,l],k)=>{
    const j=k>2?2.5:k===0?1:0;
    const ff=f+(Math.random()-.5)*2*j, ll=l+(Math.random()-.5)*2*j;
    const x=ox+hx*ff+lx*ll, y=oy+hy*ff+ly*ll;
    return{x,y,px:x-vx/60,py:y-vy/60};
  });
  for(const p of pts) if(ragBlock(p.x,p.y)){p.x=ox;p.y=oy;p.px=ox-vx/60;p.py=oy-vy/60;}
  const con=[]; for(let i=0;i<pts.length;i++) for(let k=i+1;k<pts.length;k++) con.push([i,k,Math.hypot(pts[i].x-pts[k].x,pts[i].y-pts[k].y)]);
  const P0=pts[2], tgt=pts.map(p=>({x:p.x-P0.x,y:p.y-P0.y}));
  let lv=live.map(p=>({x:p.x-live[2].x,y:p.y-live[2].y}));
  const lp=live[2], vxp=P0.px-P0.x, vyp=P0.py-P0.y;
  for(let k=0;k<pts.length;k++){const p=pts[k]; p.x=lp.x+lv[k].x; p.y=lp.y+lv[k].y; p.px=p.x+vxp; p.py=p.y+vyp;}
  const dur=.75+Math.random()*.15;
  const lag=pts.map((_,k)=>k===2||k===1?0:k===0?.08:k<7?.18+Math.random()*.08:.1+Math.random()*.06);
  u.rag={pts,con,frozen:false,still:0,age:0,bt:0,anim:{t:0,dur,live:lv,tgt,lag,dx:Math.cos(a),dy:Math.sin(a),hit:false,ph:Math.random()*6},h:1,cloth:u.col,skin:u.skin||'#c9b09a',metal:u.ring,foeId:u.foeId,kind:u.kind};

function freezeRag(r){ if(r.anim) finishAnim(r); r.frozen=true; for(const p of r.pts){p.px=p.x;p.py=p.y;} }
function animOff(r,k,t){
  const A=r.anim, lv=A.live[k], tg=A.tgt[k]; const T1=.15, T2=.6;

  else if(k>=3&&k!==5&&k!==6&&k<9){const ox=lv.x-A.live[1].x,oy=lv.y-A.live[1].y,ol=Math.hypot(ox,oy)||1; jx=ox/ol*7+A.dx*3; jy=oy/ol*7+A.dy*3;}

function finishAnim(r){
  const A=r.anim; if(!A)return;
  const p2=r.pts[2], vx=p2.x-p2.px, vy=p2.y-p2.py;
  for(let k=0;k<r.pts.length;k++){const p=r.pts[k]; if(k!==2){const nx=p2.x+A.tgt[k].x, ny=p2.y+A.tgt[k].y; if(!ragBlock(nx,ny)&&Math.hypot(nx-p.x,ny-p.y)<3){p.x=nx;p.y=ny;}} p.px=p.x-vx; p.py=p.y-vy;}
  r.con=[]; for(let i=0;i<r.pts.length;i++) for(let k=i+1;k<r.pts.length;k++) r.con.push([i,k,Math.hypot(r.pts[i].x-r.pts[k].x,r.pts[i].y-r.pts[k].y)]);

}
function updateRags(dt){
  if(dt<=0)return;
  const ex=Math.exp(-2.6*dt);
  for(const r of rags){
    if(r.frozen) continue;
    r.age+=dt;
    if(r.anim){
      const A=r.anim; A.t+=dt; const p=r.pts[2];
      let vx=p.x-p.px, vy=p.y-p.py;
      const sp=Math.hypot(vx,vy)/Math.max(dt,1e-4), ns=Math.max(0,sp*ex-110*dt), kk=sp>0?ns/sp:0;
      vx*=kk; vy*=kk; p.px=p.x; p.py=p.y;
      if(ragBlock(p.x+vx,p.y)){ vx*=-.35; } // bounce
      p.x+=vx;
      if(ragBlock(p.x,p.y+vy)){ vy*=-.35; }
      p.y+=vy;
      for(let k=0;k<r.pts.length;k++){
        if(k===2)continue;
        const o=animOff(r,k,A.t), q=r.pts[k];
        q.px=q.x; q.py=q.y;
        const nx=p.x+o.x, ny=p.y+o.y;
        if(!ragBlock(nx,ny)){ q.x=nx; q.y=ny; }
      }
      r.h=A.t<.15?1:A.t<.6?1-((A.t-.15)/.45)**2:0;
      if(A.t>=A.dur){ finishAnim(r); r.still=0; }
      continue;
    }
    let mvx=0,mvy=0; for(const p of r.pts){mvx+=p.x-p.px;mvy+=p.y-p.py;} mvx/=r.pts.length; mvy/=r.pts.length;
    let sp=Math.hypot(mvx,mvy)/Math.max(dt,1e-4); const ns=Math.max(0,sp*ex-110*dt), k=sp>0?ns/sp:0; mvx*=k; mvy*=k;
    for(const p of r.pts){
      let vx=mvx, vy=mvy; p.px=p.x; p.py=p.y;
      if(ragBlock(p.x+vx,p.y)) vx*=-.4; p.x+=vx;
      if(ragBlock(p.x,p.y+vy)) vy*=-.4; p.y+=vy;
    }
    for(let it=0;it<6;it++) for(const[i,j,L] of r.con){
      const a=r.pts[i], b=r.pts[j]; const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.001, c=(d-L)/d*.5;

    }

}
function drawRag(u){
  const r=u.rag; if(!r) return;

  }

  ctx.stroke();

  ctx.lineTo(P[1].x-nx*sw*1.15,P[1].y-ny*sw*1.15);
  ctx.lineTo(P[2].x-nx*sw*.75,P[2].y-ny*sw*.75);

  ctx.beginPath(); ctx.arc(P[0].x,P[0].y,4.8,0,6.28); ctx.fill();
  if(r.foeId==='knight'){ ctx.fillStyle='#1a1a22'; ctx.fillRect(P[0].x-1,P[0].y-2,2.2,4); }
}

/* ---------- small helpers ---------- */
const TAU=Math.PI*2;
function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
function aimAngle(h){
  if(TCH.on){
    if(TCH.aim){ const v=stickVec(TCH.aim); if(v && v.m>0.15) return Math.atan2(v.dy,v.dx); }
    const e=nearest(h.x,h.y,320); if(e) return Math.atan2(e.y-h.y,e.x-h.x);
    return h.a;
  }
  if(G.autoAim){ const e=nearest(h.x,h.y,360); if(e) return Math.atan2(e.y-h.y,e.x-h.x); }
  const wx = cam.x + (mouse.x - W/2)/ZOOM, wy = cam.y + (mouse.y - H/2)/ZOOM;
  return Math.atan2(wy-h.y, wx-h.x);
}
function nearest(x,y,r,skip){
  let best=null, bd=r;
  for(const e of enemies){ if(!e.alive || (skip&&skip.has(e))) continue; const d=Math.hypot(e.x-x,e.y-y); if(d<bd){bd=d;best=e;} }
  return best;
}
function nearestN(x,y,r,n){
  const L=[]; for(const e of enemies){ if(!e.alive) continue; const d=Math.hypot(e.x-x,e.y-y); if(d<r) L.push([d,e]); }
  L.sort((a,b)=>a[0]-b[0]); return L.slice(0,n).map(v=>v[1]);
}
function inCirc(x,y,r){ const L=[]; for(const e of enemies){ if(e.alive && Math.hypot(e.x-x,e.y-y)<r+e.r*0.6) L.push(e);} return L; }
function inRing(x,y,r0,r1){ const L=[]; for(const e of enemies){ if(!e.alive) continue; const d=Math.hypot(e.x-x,e.y-y); if(d>=r0-e.r*0.5 && d<r1+e.r*0.5) L.push(e);} return L; }
function inCone(x,y,a,r,arc){

    if(d>r+e.r*0.7) continue; if(full||d<e.r+8||Math.abs(angDiff(Math.atan2(dy,dx),a))<=arc/2+Math.atan2(e.r,Math.max(d,1))*0.6) L.push(e); }

}
function inLine(x,y,a,len,w){
  const L=[], ca=Math.cos(a), sa=Math.sin(a);
  for(const e of enemies){ if(!e.alive) continue; const dx=e.x-x, dy=e.y-y; const f=dx*ca+dy*sa, s=-dx*sa+dy*ca;
    if(f>-e.r && f<len+e.r && Math.abs(s)<w/2+e.r*0.7) L.push(e); }

function clampPt(x,y){ return {x:Math.max(T*1.3,Math.min(ARENA_W-T*1.3,x)), y:Math.max(T*1.3,Math.min(ARENA_H-T*1.3,y))}; }

  for(let i=1;i<=n;i++){ const nx=h.x+Math.cos(a)*sg*Math.min(Math.abs(dist),i*st), ny=h.y+Math.sin(a)*sg*Math.min(Math.abs(dist),i*st); if(!walkOk(nx,ny,h.r*0.7)) break; ex=nx; ey=ny; }

/* ---------- timeline (game-time scheduler; pauses during hitstop) ---------- */

function hurt(e, dmg, a, o){

  else if(school==='Fire' && statusHas(e,'freeze')){ applyStatus(e,'freeze',0); mult*=1.3; dots(e.x,e.y,8,'#ffffff',90,.6); tag='MELT!'; tagCol='#ff9a4a'; G.combos.melt++; }
  if(school==='Light' && (e.foeId==='shade'||e.foeId==='skel')){ mult*=1.5; tag=tag||'PURGE!'; tagCol=tagCol||'#ffe08a'; G.combos.light++; }
  if(school==='Dark' && (e.foeId==='wisp')){ mult*=1.5; tag=tag||'ECLIPSE!'; tagCol=tagCol||'#c090ff'; G.combos.dark++; }

function inCircle2(x,y,r){ return inCirc(x,y,r); }

function runActs(h, acts, c){
  const a0 = aimAngle(h); // direction is committed when the move starts (delayed parts don't re-aim)
  for(const act of acts){
    const p=act[0], q=act[1]||{};
    const fn=PRIM[p]; if(!fn){ reportErr(new Error('unknown prim '+p)); continue; }
    const go=()=>{ if(!h.alive) return; const a = q.ka!=null ? h._ka : (q.re ? aimAngle(h) : a0); h.a=a; fn(h,a,q,c); };
    if(q.t) later(q.t*(h.awk>0?0.8:1), go); else go();
  }
}
function ctxFor(h,kind,school,extra){ const s=SCHOOLS[school]||{color:'#fff'}; return Object.assign({kind, school, col:s.color, ring:s.ring, mul:1}, extra||{}); }

/* ---------- Warriors-style inputs ---------- */
function speedMul(h){ return h.awk>0 ? 0.72 : 1; }
function press(slot){
  if(!player || G.state!=='play') return;
  const h=player;
  try{
    if(slot==='ws'){ warriorSpecial(h); return; }
    if(slot==='awaken'){ toggleAwaken(h); return; }
    if(slot==='move'){ useMob(h); return; }
    if(h.lock>0 || G.cut){ h.buf=slot; return; }
    if(slot==='main') doMain(h);
    else if(slot==='melee') doBranch(h);
    else if(slot==='special') castArt(h);
  }catch(err){ reportErr(err); }
}
function doMain(h){
  const S=h.set.string; if(h.step>=S.length) h.step=0;
  const st=S[h.step];
  runActs(h, st.a, ctxFor(h,'str',h.set.school,{step:h.step}));
  h.step++; h.lock=(st.lk||0.26)*speedMul(h); h.strT=0.85;
  h.lastAct='S'+h.step+' · '+st.n; h.lastActT=1.2;
  G.stats.str++;
  if(h.step>=S.length){ h.strT=0.5; }
}
function doBranch(h){
  const B=h.set.branch; const idx=Math.min(h.step, B.length-1);
  const b=B[idx];
  runActs(h, b.a, ctxFor(h,'br',h.set.school,{step:idx}));
  h.lock=(b.lk||0.55)*speedMul(h); h.step=0; h.strT=0;
  h.lastAct='C'+(idx+1)+' · '+b.n; h.lastActT=1.6;
  comboBanner('C'+(idx+1)+' '+b.n.toUpperCase(), h.x, h.y-62, SCHOOLS[h.set.school].ring);
  G.stats.br++;
}
function castArt(h){
  const A=h.art; if(h.artCd>0){ toast(A.name+' '+h.artCd.toFixed(1)+'s'); return; }
  runActs(h, A.a, ctxFor(h,'art',A.school));
  h.artCd=A.cd||6; h.lock=(A.lk||0.45)*speedMul(h); h.step=0;
  h.lastAct='ART · '+A.name; h.lastActT=1.6;
  comboBanner(A.name.toUpperCase(), h.x, h.y-62, SCHOOLS[A.school].ring);
  G.stats.art++;
}
function useMob(h){
  const M=h.mob; if(h.mobCd>0) return;
  // dodge-cancel: clears recovery and buffered input, keeps the string step
  h.lock=0; h.buf=null; h.tw=null; h.ctrT=0;
  h._ka = (Math.hypot(h.mvx||0,h.mvy||0)>0.2) ? Math.atan2(h.mvy,h.mvx) : aimAngle(h);
  runActs(h, M.a, ctxFor(h,'mob',M.school));
  h.mobCd=M.cd||0.7; h.lastAct='MOVE · '+M.name; h.lastActT=1;
  G.stats.mob++;
}
function warriorSpecial(h, force){
  if(G.cut) return;
  if(h.wg<100 && !force){ toast('Warrior gauge '+Math.floor(h.wg)+'%'); return; }
  h.wg=0; const ws=h.set.ws;
  startCut(h, ws.n, 'WARRIOR SPECIAL', SCHOOLS[h.set.school]);
  h.iframe=2.4; h.lock=1.2; h.step=0;
  later(0.05,()=>runActs(h, ws.a, ctxFor(h,'ws',h.set.school)));
  h.lastAct='WS · '+ws.n; h.lastActT=2.5; G.stats.ws++;
}
function startCut(h,title,sub,s){
  G.cut={t:0,max:1.1,title,sub,col:s.color,ring:s.ring,portrait:h.portrait};
  G.flashT=0.18; G.flashCol='#ffffff'; G.slowT=0.75; addShake(6);
}
function toggleAwaken(h, force){
  if(h.awk>0){ endAwaken(h); return; }
  if(h.ag<50 && !force){ toast('Awakening needs 50% ('+Math.floor(h.ag)+'%)'); return; }
  h.awkMax = 5 + (force?100:h.ag)/100*7; h.awk=h.awkMax; h.ag=0;
  startCut(h,'AWAKENING','SPEED + POWER · EVERY HIT BREAKS ARMOR',{color:'#ffd040',ring:'#fff0a0'});
  G.cut.max=0.8; h.iframe=1;
  addPart({shock:1,x:h.x,y:h.y,r0:h.r,r1:200,col:'#ffd040',t:.5,max:.5,lw:10});
  hitList(h,inCirc(h.x,h.y,200),{d:30,kb:420,up:200},ctxFor(h,'awk',h.set.school),h.x,h.y);
  G.stats.awk++;
}
function endAwaken(h){
  h.awk=0; const s=h.set;
  startCut(h, 'AWAKENING FINISH', s.ws.n2||('Unbound '+s.name), SCHOOLS[s.school]);
  h.iframe=1.8; h.lock=1;
  const c=ctxFor(h,'awk',s.school,{mul:1.6});
  later(0.05,()=>{ runActs(h, [['qk',{n:4,gap:55,d:55,up:420,iv:0.1}]], c); runActs(h, s.branch[s.branch.length-1].a, c); });
  G.stats.awkFin++;
}

/* ---------- spawn / reset ---------- */
function makeFoe(id,x,y){
  const t=FOE[id];
  return {foeId:id,name:t.name,col:t.col,ring:t.ring,r:t.r,hp:t.hp,maxhp:t.hp,kind:t.kind,spd:t.spd,x,y,a:0,alive:true,
    kx:0,ky:0,z:0,vz:0,status:{},flash:0,brkMax:t.brk||0,brk:t.brk||0,brkShow:0,broken:0,rushed:0,cd:Math.random()*0.6,atkCd:1.5+Math.random()*2,tele:0,wbT:0,wt:t.wt||null,stag:0,sq:0};
}
function freeSpot(cx,cy,r0,r1){
  for(let k=0;k<30;k++){ const a=Math.random()*TAU, d=r0+Math.random()*(r1-r0); const p=clampPt(cx+Math.cos(a)*d, cy+Math.sin(a)*d); if(walkOk(p.x,p.y,30)) return p; }
  return clampPt(cx+r0,cy);
}
function spawnWave(n){
  n=n||30; const live=enemies.filter(e=>e.alive).length; n=Math.min(n, 64-live);
  const mons=['slime','wisp','skel','imp','shade'];
  for(let i=0;i<n;i++){
    let id = mons[(Math.random()*mons.length)|0];
    if(i%12===5) id='knight'; if(i%20===11) id='golem';
    const p=freeSpot(player.x,player.y,260,620); enemies.push(makeFoe(id,p.x,p.y));
  }
  G.wave++; toast('WAVE '+G.wave+' — '+n+' foes');
}
function spawnArmored(){
  for(const id of ['knight','golem','knight']){ const p=freeSpot(player.x,player.y,170,280); enemies.push(makeFoe(id,p.x,p.y)); }
  toast('Armored foes — break their weak-point gauge');
}
function spawnDummies(){
  for(let i=0;i<6;i++){ const a=i/6*TAU; const p=clampPt(player.x+Math.cos(a)*150, player.y+Math.sin(a)*150); enemies.push(makeFoe('dummy',p.x,p.y)); }
}
function clearAll(){ decals.length=0; enemies=[]; projectiles=[]; fields=[]; parts=[]; dmgNums=[]; wallsTemp.length=0; rags=[]; sched.length=0; }
function resetLab(){
  clearAll();
  const keep = player ? {set:player.set, art:player.art, mob:player.mob, portrait:player.portrait} : null;
  player = makeHero(keep?keep.portrait:PORTRAIT_NAMES[0], ARENA_W/2, ARENA_H/2);
  if(keep){ player.set=keep.set; player.art=keep.art; player.mob=keep.mob; }
  G.kos=0; G.wave=0; spawnWave(20);
}

/* ---------- update ---------- */
function update(dt){
  const h=player;
  if(G.cut){ G.cut.t+=dt; if(G.cut.t>=G.cut.max) G.cut=null; }
  if(G.slowT>0){ G.slowT-=dt; dt*=0.25; }
  gameT+=dt; runSched();
  // hero timers
  h.lock-=dt; h.ctrT=Math.max(0,(h.ctrT||0)-dt); h.artCd=Math.max(0,h.artCd-dt); h.mobCd=Math.max(0,h.mobCd-dt); h.iframe=Math.max(0,h.iframe-dt);
  h.flash=Math.max(0,h.flash-dt); h.hopT=Math.max(0,h.hopT-dt); h.rollT=Math.max(0,(h.rollT||0)-dt); h.lastActT-=dt;
  if(h.buffs.dmgT>0) h.buffs.dmgT-=dt; if(h.buffs.spdT>0) h.buffs.spdT-=dt;
  if(h.hitT>0){ h.hitT-=dt; if(h.hitT<=0) h.hits=0; }
  if(h.swing){ h.swing.t+=dt; if(h.swing.t>h.swing.dur+0.06) h.swing=null; }
  if(h.lock<=0){
    if(h.strT>0){ h.strT-=dt; if(h.strT<=0) h.step=0; }
    if(h.buf){ const b=h.buf; h.buf=null; press(b); }
    else if(mouse.down || keys.KeyJ || TCH.held.main) press('main');
  }
  if(TCH.specDown && performance.now()-TCH.specDown>480){ TCH.specDown=0; press('awaken'); }
  if(h.awk>0){ h.awk-=dt; if(h.awk<=0) endAwaken(h); }
  h.regenT-=dt; if(h.regenT<=0){ h.regenT=1; h.hp=Math.min(h.maxhp,h.hp+12); }
  // movement
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1; if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(TCH.move){ const v=stickVec(TCH.move); if(v&&v.m>0.12){ mx=v.dx*v.m; my=v.dy*v.m; } }
  const ml=Math.hypot(mx,my); if(ml>1){ mx/=ml; my/=ml; }
  h.mvx=mx; h.mvy=my;
  if(h.tw){ const w=h.tw; w.t+=dt; const f=Math.min(1,w.t/w.dur), e=1-(1-f)*(1-f);
    h.x=w.sx+(w.ex-w.sx)*e; h.y=w.sy+(w.ey-w.sy)*e; if(f>=1) h.tw=null; }
  else {
    const spd=h.spd*(h.awk>0?1.25:1)*(h.buffs.spdT>0?(h.buffs.spd||1):1)*(h.lock>0?0.3:1);
    const nx=h.x+mx*spd*dt, ny=h.y+my*spd*dt;
    if(walkOk(nx,h.y,h.r*0.7)) h.x=nx; if(walkOk(h.x,ny,h.r*0.7)) h.y=ny;
  }
  if(h.lock<=0){ if(!TCH.on) h.a=aimAngle(h); else if(TCH.aim) h.a=aimAngle(h); else if(ml>0.2) h.a=Math.atan2(my,mx); }
  updateEnemies(dt);
  updateProjectiles(dt);
  updateFields(dt);
  for(let i=wallsTemp.length-1;i>=0;i--){ wallsTemp[i].t-=dt; if(wallsTemp[i].t<=0) wallsTemp.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t-=dt; if(p.vx){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; } if(p.t<=0) parts.splice(i,1); }
  for(let i=dmgNums.length-1;i>=0;i--){ const d=dmgNums[i]; d.t-=dt; d.y-=(d.banner?22:40)*dt; if(d.t<=0) dmgNums.splice(i,1); }
  updateRags(dt);

}

function updateEnemies(dt){
  const h=player; let dead=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive){ dead++; continue; }
    e.flash=Math.max(0,e.flash-dt); if(e.sq>0) e.sq-=dt; if(e.stag>0) e.stag-=dt;
    for(const k in e.status){ if(e.status[k]>0) e.status[k]-=dt; }
    if(e.brkShow>0) e.brkShow-=dt;
    if(e.broken>0){ e.broken-=dt; if(e.broken<=0){ e.brk=e.brkMax; e.rushed=0; } }
    if(statusHas(e,'burn')){ e.burnT=(e.burnT||0)-dt; if(e.burnT<=0){ e.burnT=0.5; hurt(e,5+(e._heat||0)*2,0,{knock:0,col:'#ff8a3a',owner:null,kind:'dot'}); if(!e.alive) continue; } }
    if(e.held){ const a=aimAngle(e.held); e.x=e.held.x+Math.cos(a)*42; e.y=e.held.y+Math.sin(a)*42; e.z=22; e.vz=0; continue; }
    // airborne (juggle)
    if(e.z>0||e.vz>0){ e.vz-=1300*dt; e.z+=e.vz*dt;
      if(e.z<=0){ e.z=0; if(e.vz<-430){ e.vz=-e.vz*0.32; dust(e.x,e.y,20); } else e.vz=0; } }
    // knockback with wall bounce
    if(Math.abs(e.kx)+Math.abs(e.ky)>2){
      const nx=e.x+e.kx*dt, ny=e.y+e.ky*dt;
      if(walkOk(nx,e.y,e.r*0.6)) e.x=nx; else { if(e.wbT>0) wallBounce(e); e.kx*=-0.45; }
      if(walkOk(e.x,ny,e.r*0.6)) e.y=ny; else { if(e.wbT>0) wallBounce(e); e.ky*=-0.45; }
      const dk=Math.exp(-(e.z>4||e.thrown?2.5:7)*dt); e.kx*=dk; e.ky*=dk;
    }
    if(e.wbT>0) e.wbT-=dt;
    if(e.thrown){ const th=e.thrown; th.t-=dt;
      for(const o of enemies){ if(o===e||!o.alive||th.hit.has(o)) continue; if(Math.hypot(o.x-e.x,o.y-e.y)<o.r+e.r){ th.hit.add(o); hurt(o,th.d,Math.atan2(o.y-e.y,o.x-e.x),th.o); } }
      if(th.t<=0 || Math.abs(e.kx)+Math.abs(e.ky)<120){ e.thrown=null; explode(th.h,e.x,e.y,80,Q(th.q,{d:th.q.d,up:300}),th.c); hurt(e,th.self,0,Object.assign({},th.o,{up:200})); addShake(6); if(!e.alive) continue; }
    }
    if(e.foeId==='dummy'){ if(G.dummyMove){ e.x+=Math.cos(gameT*1.5+i)*60*dt; } continue; }
    const busy = statusHas(e,'stun')||statusHas(e,'freeze')||e.z>4||e.broken>0||e.stag>0;
    const dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.tele>0){ e.tele-=dt; if(busy){ e.tele=0; }
      else if(e.tele<=0){ // armored heavy swing
        addPart({cres:1,x:e.x,y:e.y,a0:e.teleA-0.9,a1:e.teleA+0.9,r:e.r+70,w:22,col:'#ff5050',t:.2,max:.2});
        const pa=Math.atan2(h.y-e.y,h.x-e.x);
        if(d<e.r+h.r+70 && Math.abs(angDiff(pa,e.teleA))<1.0) hurtHero(h, e.foeId==='golem'?90:60, pa);
        e.atkCd=2.6+Math.random()*1.6; }
      continue; }
    if(busy) continue;
    e.a=Math.atan2(dy,dx);
    const spd=e.spd*(statusHas(e,'slow')?0.5:1)*(statusHas(e,'root')?0:1)*(statusHas(e,'blind')?0.4:1);
    if(d>e.r+h.r-4){ let vx=dx/d*spd, vy=dy/d*spd;
      // light separation (cheap: only neighbours in index window)
      for(let k=Math.max(0,i-6);k<Math.min(enemies.length,i+7);k++){ const o=enemies[k]; if(o===e||!o.alive) continue; const sx=e.x-o.x, sy=e.y-o.y, sd=Math.hypot(sx,sy); const md=e.r+o.r-6; if(sd<md&&sd>0.1){ vx+=sx/sd*(md-sd)*6; vy+=sy/sd*(md-sd)*6; } }
      const nx=e.x+vx*dt, ny=e.y+vy*dt; if(walkOk(nx,e.y,e.r*0.6)) e.x=nx; if(walkOk(e.x,ny,e.r*0.6)) e.y=ny; }
    e.cd-=dt; if(d<e.r+h.r+6 && e.cd<=0){ e.cd=0.7; hurtHero(h,8,e.a); }
    if(e.brkMax>0){ e.atkCd-=dt; if(e.atkCd<=0 && d<e.r+h.r+80){ e.tele=0.65; e.teleA=e.a; } }
  }
  // cap corpses (keeps tablet draw cost flat over many waves)

  if(dead>lim){ let rm=dead-lim; for(let i=0;i<enemies.length && rm>0;i++){ const e=enemies[i]; if(!e.alive){ if(e.rag){ const k=rags.indexOf(e.rag); if(k>=0) rags.splice(k,1); } enemies.splice(i,1); i--; rm--; } } }
}
function wallBounce(e){
  e.wbT=0; hurt(e, e.wbD||12, Math.atan2(-e.ky,-e.kx), {owner:e.wbO,knock:0,col:'#ffd27a',kind:'wall',br:6});
  comboBanner('WALL BOUNCE!', e.x, e.y-30, '#ffd27a'); addPart({star:1,x:e.x,y:e.y,r:34,col:'#ffd27a',t:.22,max:.22}); addPart({shock:1,x:e.x,y:e.y,r0:6,r1:70,col:'#ffd27a',t:.25,max:.25,lw:7}); addPart({burst:1,x:e.x,y:e.y,n:12,len:90,col:'#ffd27a',t:.22,max:.22,seed:Math.random()*9}); addDecal(e.x,e.y,34,'#ffd27a'); hitstop(0.07); addShake(8); punchZ=Math.max(punchZ,0.035); G.wallBounces++;
  if(e.alive){ e.vz=Math.max(e.vz,260); if(e.z<=0) e.z=1; }

function hurtHero(h,dmg,a){
  if(h.iframe>0 || G.cut) return;
  if(h.ctrT>0 && h.ctrQ){ riposte(h,a); return; }
  dmg=Math.round(dmg*(h.awk>0?0.6:1));
  if(h.shield>0){ const abs=Math.min(h.shield,dmg); h.shield-=abs; dmg-=abs; }
  if(dmg<=0) return;
  h.hp=Math.max(1,h.hp-dmg); h.flash=0.15; addDmgNum(h.x,h.y-30,dmg,'#ff6060');
  h.wg=Math.min(100,h.wg+dmg*0.05);
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=dt; let dead=false;
    if(p.polar){ const P=p.polar; const cx=P.fol?P.fol.x:P.cx, cy=P.fol?P.fol.y:P.cy; const r=Math.max(0,P.r0+P.vr*p.t), an=P.a0+P.w*p.t;
      p.x=cx+Math.cos(an)*r; p.y=cy+Math.sin(an)*r; p.a=an+Math.PI/2*(P.w>=0?1:-1);
      if(p.t>=p.life){ if(P.endEx) explode(p.owner,cx,cy,P.endEx,Q(p.q,{up:360}),p.c); dead=true; } }
    else {
      if(p.home){ const e=nearest(p.x,p.y,320); if(e){ const ta=Math.atan2(e.y-p.y,e.x-p.x); p.a+=Math.max(-p.home*dt,Math.min(p.home*dt,angDiff(ta,p.a))); } }
      if(p.boom && p.t>p.life*0.45){ const ta=Math.atan2(p.owner.y-p.by,p.owner.x-p.bx); p.a+=Math.max(-9*dt,Math.min(9*dt,angDiff(ta,p.a))); if(p.t>p.life*0.55 && Math.hypot(p.owner.x-p.bx,p.owner.y-p.by)<30) dead=true; if(p.t>p.life*0.5 && p.hit.size && !p._rh){ p._rh=1; p.hit.clear(); } }
      if(p.acc) p.v=Math.min(1400,p.v+p.acc*dt);
      const nbx=p.bx+Math.cos(p.a)*p.v*dt, nby=p.by+Math.sin(p.a)*p.v*dt;
      if(solidAt(nbx,nby) && !p.boom){
        if(p.bounce>0){ p.bounce--; if(solidAt(nbx,p.by)) p.a=Math.PI-p.a; else p.a=-p.a; p.hit.clear(); dots(p.x,p.y,4,p.col,100,.2); }
        else { if(p.ex) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); else dots(p.x,p.y,4,p.col,100,.2); dead=true; }
      } else { p.bx=nbx; p.by=nby; }
      if(p.wv){ const s=Math.sin(p.t*p.wv.f)*p.wv.amp; p.x=p.bx-Math.sin(p.a)*s; p.y=p.by+Math.cos(p.a)*s; } else { p.x=p.bx; p.y=p.by; }
      if(p.t>=p.life){ if(p.ex && !dead) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); dead=true; }
    }
    if(p.trail){ p.trT-=dt; if(p.trT<=0){ p.trT=0.09; addField({kind:'pool',x:p.x,y:p.y,r:22,dur:1.2,tk:0.3,h:p.owner,c:p.c,q:p.q,d:Math.max(1,Math.round(p.d*0.2)),o:Object.assign({},p.o,{knock:0}),col:p.col,small:1}); } }
    if(!dead){
      for(const e of enemies){ if(!e.alive||p.hit.has(e)) continue;
        const rr=p.r+e.r*0.7; const dx=e.x-p.x, dy=e.y-p.y; if(dx*dx+dy*dy>rr*rr) continue;
        p.hit.add(e); hurt(e,p.d,p.sh==='wave'?p.a:Math.atan2(dy,dx),p.o);
        if(p.jump>0){ const tg=nearest(p.x,p.y,p.jr,p.hit); if(tg){ p.jump--; p.a=Math.atan2(tg.y-p.y,tg.x-p.x); p.bx=p.x; p.by=p.y; p.t=Math.min(p.t,p.life*0.55); addPart({shock:1,x:p.x,y:p.y,r0:4,r1:28,col:p.col,t:.15,max:.15,lw:3}); } else p.jump=0; }
        if(p.sh!=='wave' && p.hit.size<=1) hitstop(0.02);
        if(p.split && !p.splitDone){ p.splitDone=1; for(let k=0;k<p.split;k++){ const q=spawnP(p.owner,p.a+(k-(p.split-1)/2)*0.7+Math.PI*0,Q(p.q,{split:0,d:Math.round((p.q.d||20)*0.6),life:0.45,v:420}),p.c,k); q.bx=q.x=p.x; q.by=q.y=p.y; q.hit.add(e); } }
        if(p.ex){ explode(p.owner,p.x,p.y,p.ex,p.q,p.c); if(!p.pierce){ dead=true; break; } }
        if(p.pierce<=0 && !p.boom && !p.polar){ dead=true; break; }
        p.pierce--;
      }
    }
    if(dead) projectiles.splice(i,1);
  }
}

function updateFields(dt){
  for(let i=fields.length-1;i>=0;i--){
    const f=fields[i]; f.t+=dt;
    if(f.fol){ if(f.kind==='turret'){ f.x=f.fol.x+f.ox; f.y=f.fol.y+f.oy; } else { f.x=f.fol.x; f.y=f.fol.y; } }
    if(f.vx){ const nx=f.x+f.vx*dt, ny=f.y+f.vy*dt; if(!solidAt(nx,ny)){ f.x=nx; f.y=ny; } else { f.vx=-f.vx; f.vy=-f.vy; } }
    if(f.kind==='vortex'){ for(const e of inCirc(f.x,f.y,f.r*1.5)){ if(e.brkMax>0&&!(e.broken>0)) continue; const dx=f.x-e.x, dy=f.y-e.y, d=Math.hypot(dx,dy)||1; if(d>12){ e.x+=dx/d*f.pull*dt; e.y+=dy/d*f.pull*dt; } } }
    if(f.kind==='beam' && f.track){ f.a=aimAngle(f.h); } else if(f.kind==='beam'){ f.a=f.a0+f.rot*(f.t/f.dur); }
    if(f.kind==='mine'){ if(f.fuse!=null){ f.fuse-=dt; if(f.fuse<=0) f.t=f.dur; } else if(f.t>f.arm && inCirc(f.x,f.y,f.trig).length) f.fuse=0.06; }
    f.tkT-=dt;
    if(f.tkT<=0 && f.tk<50){ f.tkT=f.tk;
      if(f.kind==='pillar'||f.kind==='pool'||f.kind==='vortex'){
        const L=inCirc(f.x,f.y,f.r); const first=f.first; f.first=0;
        for(const e of L) hurt(e, first?f.d:Math.max(1,Math.round(f.d*(f.kind==='pillar'?0.35:1))), Math.atan2(e.y-f.y,e.x-f.x), first?f.o1:f.o);
        if(first && L.length) hitstop(0.04);
      } else if(f.kind==='beam'){
        for(const e of inLine(f.x,f.y,f.a,f.len,f.w+12)) hurt(e,f.d,f.a,f.o);
      } else if(f.kind==='turret'){
        const e=nearest(f.x,f.y,340);
        if(e){ const a=Math.atan2(e.y-f.y,e.x-f.x); const q=f.q; const p=spawnP(f.h,a,Q(q,{sh:q.sh||'shard',v:q.v||620,life:0.7,d:q.d||14}),f.c,0); p.x=p.bx=f.x; p.y=p.by=f.y; }
      } else if(f.kind==='coil'){
        const L=nearestN(f.x,f.y,f.zn,f.lk);
        if(L.length){ const pts=[{x:f.x,y:f.y-36}]; for(const e of L) pts.push({x:e.x,y:e.y}); addPart({chain:1,pts,col:f.col,t:.22,max:.22}); for(const e of L) hurt(e,f.d,Math.atan2(e.y-f.y,e.x-f.x),f.o); }
        const myI=fields.indexOf(f);
        for(let j=myI+1;j<fields.length;j++){ const g=fields[j]; if(g.kind!=='coil'||g.h!==f.h) continue; const dd=Math.hypot(g.x-f.x,g.y-f.y); if(dd>f.zn*0.9||dd<4) continue;
          addPart({streak:1,x0:f.x,y0:f.y-36,x1:g.x,y1:g.y-36,w:7,col:f.col,t:.2,max:.2});
          const aa=Math.atan2(g.y-f.y,g.x-f.x); for(const e of inLine(f.x,f.y,aa,dd,30)) hurt(e,Math.round(f.d*1.4),aa,f.o); }
      } else if(f.kind==='tether'){
        for(const e of f.targets){ if(e.alive && Math.hypot(e.x-f.x,e.y-f.y)<360) hurt(e,f.d,Math.atan2(f.y-e.y,f.x-e.x),f.o); }
      }
    }
    if(f.t>=f.dur){ if(f.end){ try{ f.end(f); }catch(err){ reportErr(err); } } fields.splice(i,1); }
  }
}

/* ---------- render ---------- */
const WPN = {Sword:'sword',Lance:'lance',Axe:'axe',Bow:'bow',Fire:'tome',Electric:'staff',Wind:'tome',Ice:'staff',Dark:'scythe',Light:'staff'};
function glow(b,c){ if(!G.low){ ctx.shadowBlur=b; ctx.shadowColor=c; } }
function noGlow(){ if(!G.low) ctx.shadowBlur=0; }
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#1a2a18'; ctx.fillRect(0,0,W,H);
  const sk=(G.shakeOn!==false)?shake:0;
  const sx=sk?(Math.random()-.5)*sk:0, sy=sk?(Math.random()-.5)*sk:0;
  ctx.save();
  ctx.translate(W/2+sx+kickX, H/2+sy+kickY); ctx.scale(ZOOM*(1+punchZ),ZOOM*(1+punchZ)); ctx.translate(-cam.x,-cam.y);

  const gw=Math.min(ARENA_W-gx,vw), gh=Math.min(ARENA_H-gy,vh);
  if(gw>0&&gh>0) ctx.drawImage(groundCv,gx,gy,gw,gh,gx,gy,gw,gh);
  const vx0=cam.x-vw/2, vy0=cam.y-vh/2, vx1=cam.x+vw/2, vy1=cam.y+vh/2;
  const vis=(x,y,m)=>x>vx0-m&&x<vx1+m&&y>vy0-m&&y<vy1+m;

  for(const w of wallsTemp){ ctx.globalAlpha=Math.min(1,w.t*2); ctx.fillStyle=w.col||'#9ad'; ctx.fillRect(w.x-w.hw,w.y-w.hw,w.hw*2,w.hw*2); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(w.x-w.hw,w.y-w.hw,w.hw*2,5); }
  ctx.globalAlpha=1;
  // scorch / crater decals
  for(const d of decals){ if(!vis(d.x,d.y,d.r+20)) continue; const k=Math.min(1,d.t/d.max*1.6); ctx.globalAlpha=0.5*k; ctx.fillStyle='#0c0a08'; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r,d.r*0.8,0,0,TAU); ctx.fill(); ctx.globalAlpha=0.35*k; ctx.strokeStyle=d.col; ctx.lineWidth=3; ctx.stroke(); }
  ctx.globalAlpha=1;
  // ground fields

  // foes (shadow + juggle height)

    if(e.z>2){ ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(e.x,e.y+4,e.r*0.8,e.r*0.4,0,0,TAU); ctx.fill(); }
    const lift=e.z*0.8;

    if(e.sq>0){ const k=e.sq/0.2, P=e.sqP||0.5; ctx.save(); ctx.translate(e.x+(Math.random()-.5)*5*P*k,e.y+(Math.random()-.5)*5*P*k); ctx.rotate(e.sqA||0); ctx.scale(1+0.32*P*k,1-0.22*P*k); ctx.rotate(-(e.sqA||0)); ctx.translate(-e.x,-e.y); }
    if(e.foeId==='slime'||e.foeId==='wisp') drawBlob(e); else drawFoeSprite(e, G.low);

    else if(statusHas(e,'burn') && !G.low){ ctx.fillStyle='rgba(255,120,40,.35)'; ctx.beginPath(); ctx.arc(e.x,e.y-e.r*0.4,e.r*0.6,0,TAU); ctx.fill(); }
    if(statusHas(e,'shock') && !G.low){ ctx.strokeStyle='rgba(192,240,255,.85)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+5+Math.sin(gameT*30)*2,0,TAU); ctx.stroke(); }
    if(statusHas(e,'stun')){ ctx.fillStyle='#ffe066'; for(let k=0;k<3;k++){ const a=gameT*5+k*2.1; ctx.fillRect(e.x+Math.cos(a)*e.r*0.7-2,e.y-e.r-10+Math.sin(a)*4,4,4); } }
    if(e.tele>0){ ctx.globalAlpha=0.25+0.3*(1-e.tele/0.65); ctx.fillStyle='#ff3030'; ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.arc(e.x,e.y,e.r+70,e.teleA-0.9,e.teleA+0.9); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }

  if(player.ctrT>0){ ctx.save(); ctx.globalAlpha=0.55+0.25*Math.sin(gameT*20); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.setLineDash([10,6]); ctx.lineDashOffset=-gameT*60; ctx.beginPath(); ctx.arc(player.x,player.y,player.r+16,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=(player.ctrC&&player.ctrC.col)||'#fff'; ctx.globalAlpha=0.9; for(let k=0;k<4;k++){ const an=k*Math.PI/2+gameT*2; ctx.beginPath(); ctx.arc(player.x+Math.cos(an)*(player.r+16),player.y+Math.sin(an)*(player.r+16),4,0,TAU); ctx.fill(); } ctx.restore(); }

  // particles

  ctx.globalAlpha=1; noGlow();

    if(k==='main') ring=SCHOOLS[h.set.school].ring;
    if(k==='melee') ring='#ffb070';
    if(k==='special') ring=h.artCd>0?'#556':'#9ad8ff';
    if(k==='awaken'){ ring=h.awk>0?'#ffd040':(h.ag>=50?'#c090ff':'#556'); }
    if(k==='ws'){ fill='rgba(120,80,10,.85)'; ring=(gameT*6|0)%2?'#ffe070':'#fff'; }
    if(TCH.held[t.slot]) fill='rgba(80,90,120,.9)';
    ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,TAU); ctx.fill();
    ctx.strokeStyle=ring; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,TAU); ctx.stroke();
    if(k==='special' && h.artCd>0){ ctx.strokeStyle='#9ad8ff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(t.x,t.y,t.r-4,-Math.PI/2,-Math.PI/2+TAU*(1-h.artCd/(h.art.cd||6))); ctx.stroke(); }
    if(k==='awaken'){ ctx.strokeStyle='#c090ff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(t.x,t.y,t.r-4,-Math.PI/2,-Math.PI/2+TAU*((h.awk>0?h.awk/h.awkMax:h.ag/100))); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 11px monospace'; ctx.fillText(t.label,t.x,t.y+(k==='main'?-2:4));
    if(k==='main'){ ctx.font='9px monospace'; ctx.fillText('S'+Math.min(h.step+1,h.set.string.length)+'/'+h.set.string.length,t.x,t.y+12); }
  }
  ctx.textAlign='left';
}

/* ---------- loadout overlay ---------- */
let loadoutOpen=false;
function setLoadoutOpen(open){
  loadoutOpen=!!open;
  const panel=document.getElementById('loadout'), btn=document.getElementById('btnToggle');
  if(!panel) return;
  panel.classList.toggle('collapsed',!open); panel.setAttribute('aria-hidden',open?'false':'true');
  if(btn) btn.classList.toggle('open',!!open);
  if(open && refreshLoadout) refreshLoadout();
}
let refreshLoadout=null;
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function buildLoadoutUI(){
  let filter='ALL', tab='set';
  const list=document.getElementById('moveList');
  function refresh(){
    list.innerHTML='';
    const src = tab==='set'?MOVESETS : tab==='art'?ARTS : MOBS;
    const items = src.filter(m=>filter==='ALL'||m.school===filter);
    for(const m of items){
      const S=SCHOOLS[m.school], div=document.createElement('div');
      const on = (tab==='set'&&player.set===m)||(tab==='art'&&player.art===m)||(tab==='mob'&&player.mob===m);
      div.className='mv'+(on?' on':'');
      if(tab==='set'){
        const sl=m.string.map((s,i)=>'<span class="st">S'+(i+1)+'</span> '+esc(s.n)).join(' · ');
        const bl=m.branch.map((b,i)=>'<span class="br">C'+(i+1)+'</span> '+esc(b.n)).join(' · ');
        div.innerHTML=`<b style="color:${S.ring}">${esc(m.name)}</b> <span class="tag" style="border-color:${S.color}">${m.school}</span> <span class="tag">${m.string.length}-hit · ${m.wpn}</span>${TRI[m.school]?' <span class="tag" style="color:#8fe8a8">beats '+TRI[m.school]+'</span>':''}${m.heft>=1.3?' <span class="tag" style="color:#ffb070">HEAVY</span>':''}<br><small>${esc(m.fantasy)}</small><div class="ln">${sl}</div><div class="ln">${bl}</div><div class="ln"><span class="ws">W.SP</span> ${esc(m.ws.n)}</div><small class="ins">Inspired by: ${esc(m.inspo)}</small>`;
      } else {
        div.innerHTML=`<b style="color:${S.ring}">${esc(m.name)}</b> <span class="tag" style="border-color:${S.color}">${m.school}</span> <span class="tag">CD ${m.cd}s</span><br><small>${esc(m.desc)}</small>${m.inspo?'<br><small class="ins">Inspired by: '+esc(m.inspo)+'</small>':''}`;
      }
      div.onclick=()=>{ if(tab==='set') equip(m.id); else if(tab==='art') equip(null,m.id); else equip(null,null,m.id); refresh(); toast((tab==='set'?'MOVESET':tab==='art'?'ART':'MOBILITY')+': '+m.name); };
      list.appendChild(div);
    }
    document.getElementById('countLabel').textContent=MOVESETS.length+' sets · '+ARTS.length+' arts · '+MOBS.length+' moves';
  }
  refreshLoadout=refresh;
  const st=document.getElementById('slotTabs');
  for(const [k,l] of [['set','MOVESET'],['art','COMBAT ART'],['mob','MOBILITY']]){
    const b=document.createElement('button'); b.textContent=l; b.className='chip'+(k==='set'?' on':'');
    b.onclick=()=>{ tab=k; [...st.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); refresh(); }; st.appendChild(b); }
  const sf=document.getElementById('schoolFilters');
  for(const s of ['ALL',...Object.keys(SCHOOLS)]){
    const b=document.createElement('button'); b.textContent=s; b.className='chip'+(s==='ALL'?' on':'');
    if(s!=='ALL') b.style.borderColor=SCHOOLS[s].color;
    b.onclick=()=>{ filter=s; [...sf.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); refresh(); }; sf.appendChild(b); }
  const ps=document.getElementById('portraits');
  for(const n of PORTRAIT_NAMES){
    const b=document.createElement('button'); b.className='port'+(n===player.portrait?' on':''); b.title=n; b.style.backgroundImage=`url(${PORTRAITS[n]})`;
    b.onclick=()=>{ player.portrait=n; player.name=n; [...ps.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); toast('Heroine: '+n); }; ps.appendChild(b); }
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  on('btnW20',()=>spawnWave(20)); on('btnW30',()=>spawnWave(30)); on('btnW40',()=>spawnWave(40));
  on('btnArmored',()=>spawnArmored()); on('btnDummy',()=>spawnDummies()); on('btnReset',()=>resetLab());
  on('btnMove',()=>{ G.dummyMove=!G.dummyMove; toast('Dummy move '+(G.dummyMove?'ON':'OFF')); });
  on('btnLow',()=>{ setLow(!G.low); toast(G.low?'LOW ON':'LOW OFF'); });
  on('btnImpact',()=>{ const L=[1.5,2.4,0.7,0]; G.impact=L[(L.indexOf(G.impact)+1)%L.length]; toast('Impact '+({0:'OFF',0.7:'LOW',1.5:'NORMAL',2.4:'MAX'})[G.impact]+(G.impact>=1.5?'  (impact-flash frames on)':'  (no impact-flash frames)')); });
  on('btnRoll',()=>{ const pk=a=>a[(Math.random()*a.length)|0]; const s1=pk(MOVESETS),a1=pk(ARTS),m1=pk(MOBS); equip(s1.id,a1.id,m1.id); refresh(); toast('BUILD: '+s1.name+' · '+a1.name+' · '+m1.name); });
  on('btnToggle',()=>setLoadoutOpen(!loadoutOpen)); on('btnCloseLoadout',()=>setLoadoutOpen(false));
  window.addEventListener('keydown',e=>{ if(e.code==='Escape') setLoadoutOpen(false); });
  setLoadoutOpen(false); refresh();
}
function equip(setId,artId,mobId){
  const h=player;
  if(setId){ const m=byId(MOVESETS,setId); if(!m) return false; h.set=m; h.step=0; h.strT=0; }
  if(artId){ const a=byId(ARTS,artId); if(!a) return false; h.art=a; h.artCd=0; }
  if(mobId){ const b=byId(MOBS,mobId); if(!b) return false; h.mob=b; h.mobCd=0; }
  return true;
}

/* ---------- boot + test API ---------- */
function prep(){ const h=player; h.lock=0; h.buf=null; h.tw=null; h.artCd=0; h.mobCd=0; G.cut=null; G.slowT=0; }
function boot(){
  loadPortraits(); genArena();
  player=makeHero(PORTRAIT_NAMES[0]||'Emma', ARENA_W/2, ARENA_H/2);
  resize(); setLow(G.low); buildLoadoutUI();
  spawnWave(20);
  toast('Move Lab 3.3 — '+MOVESETS.length+' movesets · weapon triangle: Sword > Axe > Lance > Sword');
  window.BD3 = {
    G, get player(){return player;}, get enemies(){return enemies;}, get rags(){return rags;}, get parts(){return parts;},
    MOVESETS, ARTS, MOBS, SCHOOLS, press, equip,
    runString:(id)=>{ equip(id); prep(); player.step=0; const n=player.set.string.length; for(let i=0;i<n;i++){ player.lock=0; doMain(player); } return n; },
    runStep:(id,i)=>{ equip(id); prep(); player.step=i; doMain(player); },
    runBranch:(id,n)=>{ equip(id); prep(); player.step=n; doBranch(player); return player.lastAct; },
    castArt:(id)=>{ equip(null,id); prep(); castArt(player); return player.lastAct; },
    useMobility:(id)=>{ equip(null,null,id); prep(); useMob(player); return player.lastAct; },
    warriorSpecial:(id)=>{ if(id) equip(id); prep(); warriorSpecial(player,true); return player.lastAct; },
    awaken:()=>{ prep(); toggleAwaken(player,true); return player.awk; },
    endAwaken:()=>{ if(player.awk>0) endAwaken(player); return G.stats.awkFin; },
    forceBreak:()=>{ const e=enemies.find(e=>e.alive&&e.brkMax>0); if(e){ e.brk=1; hurt(e,10,0,{owner:player,kind:'br',br:5,col:'#fff'}); } return !!(e&&e.broken>0); },
    spawnWave, spawnArmored, spawnDummies, resetLab, clearAll, setLow, toast,
    forceTouch:(v)=>{ TCH.show=!!v; TCH.on=!!v; resize(); },
    status:(e,k,t)=>applyStatus(e,k,t),
    spawnAt:(id,dx,dy)=>{ const p=clampPt(player.x+dx,player.y+dy); const e=makeFoe(id,p.x,p.y); enemies.push(e); return e; },
    setLoadoutOpen, heal:()=>{ player.hp=player.maxhp; },
    tp:(x,y)=>{ player.x=x; player.y=y; cam.x=x; cam.y=y; },
    measureFps:(secs)=>new Promise(res=>{ let n=0; const t0=performance.now(); (function tick(t){ n++; if(t-t0>=secs*1000) res(Math.round(n/((t-t0)/1000)*10)/10); else requestAnimationFrame(tick); })(t0); })
  };
}
let last=performance.now(), frames=0, fpsT=0;
function frame(ts){
  let dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  try{
    if(G.state==='play'){
      if(hitstopT>0){ hitstopT-=dt; if(G.cut){ G.cut.t+=dt; if(G.cut.t>=G.cut.max) G.cut=null; } shake=Math.max(0,shake-dt*20); }
      else { const n=Math.max(1,Math.ceil(dt/0.033)); for(let i=0;i<n;i++) update(dt/n); }
    }
    render();
  }catch(err){ reportErr(err); }
  frames++; fpsT+=dt; if(fpsT>=0.5){ G.fps=Math.round(frames/fpsT); frames=0; fpsT=0; }
  requestAnimationFrame(frame);
}
boot();
requestAnimationFrame(frame);
})();

</script>
