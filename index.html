const HEROINE_OF_SCHOOL = {Sword:'Wilhelmina',Lance:'Nebris',Axe:'Luvencia',Bow:'Zenith',Fire:'Diana',Electric:'Venaka',Wind:'Dalvi',Ice:'Darian',Dark:'Eclipse',Light:'Michaela'};

for(const s of Object.keys(HEROINE_OF_SCHOOL)) SCHOOL_OF_HEROINE[HEROINE_OF_SCHOOL[s]]=s;
function heroineOf(h){ return (h&&h.set&&HEROINE_OF_SCHOOL[h.set.school]) || (h&&h.portrait) || PORTRAIT_NAMES[0]; }
function applySchoolPortrait(h){ if(!h) return; const n=heroineOf(h); h.portrait=n; h.name=n; if(typeof syncPortraitUI==='function') syncPortraitUI(); }

/* ---------- canvas / viewport ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
let W=1280, H=720, DPR=1, ZOOM=1.9;

function resize(){
  const r = cv.getBoundingClientRect();

  DPR = Math.min(G.low?1:2, window.devicePixelRatio||1);
  cv.width = (W*DPR)|0; cv.height = (H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ZOOM = G.zoomSel || ((IS_TOUCH || TCH.on || TCH.show) ? 0.5 : 0.85);
}
window.addEventListener('resize', ()=>resize());

navigator.vibrate = function(){ G.vibrateUsed++; return false; };
try{
  const AC = window.AudioContext||window.webkitAudioContext;
  if(AC){ const Orig=AC; const Wrap=function(){ G.audioUsed++; return new Orig(); }; window.AudioContext=Wrap; window.webkitAudioContext=Wrap; }
  const OA = window.Audio; if(OA){ window.Audio=function(){ G.audioUsed++; return new OA(); }; }
}catch(err){}

/* ---------- arena (fantasy) ---------- */
const T=48; let AW=42, AH=28;
let ARENA_W=AW*T, ARENA_H=AH*T;
let grid=[], props=[], groundCv=null;
function genArena(){
  AW=42; AH=28; ARENA_W=AW*T; ARENA_H=AH*T; G.bgCol='#1a2a18';
  grid=[]; props=[];
  for(let y=0;y<AH;y++){
    grid[y]=[];
    for(let x=0;x<AW;x++){
      let v=0;
      if(x===0||y===0||x===AW-1||y===AH-1) v=1;
      else if(((x+y*3)%17)===0 && x>3&&y>3&&x<AW-4&&y<AH-4) v=1;
      else if(Math.hypot(x-AW/2,y-AH/2)<5) v=3;
      else if((x%9===4 && y>4 && y<AH-4) || (y%8===3 && x>4 && x<AW-4)) v=2;
      grid[y][x]=v;
    }
  }
  const spots=[[5,5],[8,21],[35,6],[36,22],[12,14],[29,17],[6,12],[38,14]];
  for(const[tx,ty] of spots){ if(grid[ty]&&grid[ty][tx]===0){ grid[ty][tx]=5; props.push({k:'tree',x:(tx+.5)*T,y:(ty+.5)*T}); } }
  buildGround();
}
function buildGround(){
  // pre-render static ground once (big tablet win vs 1176 fillRects/frame)
  groundCv = document.createElement('canvas');
  groundCv.width = ARENA_W; groundCv.height = ARENA_H;
  const g = groundCv.getContext('2d');
  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){
    const v=grid[y][x], px=x*T, py=y*T;
    if(v===1){ g.fillStyle='#5a5348'; g.fillRect(px,py,T,T); g.fillStyle='#3a342c'; g.fillRect(px+4,py+4,T-8,T-8); g.fillStyle='#6a6356'; g.fillRect(px+4,py+4,T-8,5); }
    else if(v===2){ g.fillStyle='#6b5a3e'; g.fillRect(px,py,T,T); g.fillStyle='#75644a'; g.fillRect(px+((x*7)%30),py+((y*11)%30),6,4); }
    else if(v===3){ g.fillStyle='#7a7260'; g.fillRect(px,py,T,T); g.strokeStyle='#4a4438'; g.strokeRect(px+2,py+2,T-4,T-4); }
    else { g.fillStyle = ((x+y)&1) ? '#3d6b34' : '#457a3c'; g.fillRect(px,py,T,T);
      g.fillStyle='#4f8a44'; if(((x*13+y*7)%5)===0) g.fillRect(px+10,py+18,3,7); }
  }
  // central rune circle
  g.strokeStyle='rgba(255,230,160,.25)'; g.lineWidth=3;
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,4.2*T,0,6.28); g.stroke();
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,3.2*T,0,6.28); g.stroke();
  for(const p of props){
    g.fillStyle='#2a4a20'; g.beginPath(); g.arc(p.x,p.y,20,0,6.28); g.fill();
    g.fillStyle='#5a3a18'; g.fillRect(p.x-4,p.y,8,14);
    g.fillStyle='#3d7a30'; g.beginPath(); g.arc(p.x,p.y-6,17,0,6.28); g.fill();
  }
}
function solidAt(x,y){
  const tx=Math.floor(x/T), ty=Math.floor(y/T);
  if(ty<0||tx<0||ty>=AH||tx>=AW) return true;
  const v=grid[ty][tx];
  if(v===1 || v===5) return true;
  for(const w of wallsTemp){ if(Math.abs(x-w.x)<w.hw && Math.abs(y-w.y)<w.hw) return true; }
  return false;
}
function walkOk(x,y,r){
  return !solidAt(x-r,y)&&!solidAt(x+r,y)&&!solidAt(x,y-r)&&!solidAt(x,y+r);
}

/* ---------- input ---------- */
const keys={};
const mouse={x:640,y:300,down:false,rdown:false};
window.addEventListener('keydown',e=>{
  if(e.repeat) { keys[e.code]=true; return; }
  keys[e.code]=true;
  if(e.code==='KeyJ') press('main');
  if(e.code==='KeyF'||e.code==='KeyK') press('melee');
  if(e.code==='KeyR') press('special'); if(e.code==='KeyC') press('art2');
  if(e.code==='KeyQ'||e.code==='KeyV') press('ws');
  if(e.code==='KeyE') press('awaken');
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Space'){ e.preventDefault(); press('move'); }
  if(e.code==='KeyL'){ setLow(!G.low); toast(G.low?'LOW graphics ON':'LOW graphics OFF'); }
  if(e.code==='KeyU') toggleAssist();
  if(e.code==='KeyH'){ G.shakeOn=!G.shakeOn; toast(G.shakeOn?'Screen shake ON':'Screen shake OFF'); }
  if(e.code==='KeyP') togglePause();
  if(G.mode!=='lab'){ if(e.code==='Tab' && G.mode==='camp'){ e.preventDefault(); setLoadoutOpen(!loadoutOpen); } if(e.code==='Enter' && G.mode==='camp' && !G.overlay) nextRoom(); return; }
  if(e.code==='KeyT'){ const b=document.getElementById('btnRoll'); if(b) b.click(); }
  if(e.code==='Digit1') spawnWave(20);
  if(e.code==='Digit2') spawnWave(30);
  if(e.code==='Digit3') spawnWave(40);
  if(e.code==='Digit4') spawnArmored();
  if(e.code==='Digit0') resetLab();
  if(e.code==='Tab'){ e.preventDefault(); setLoadoutOpen(!loadoutOpen); }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
});
cv.addEventListener('mousedown',e=>{
  if(e.pointerType==='touch') return;
  if(e.button===0){ mouse.down=true; press('main'); }
  if(e.button===2){ mouse.rdown=true; press('melee'); }
  if(e.button===1){ e.preventDefault(); press('special'); }
});
window.addEventListener('mouseup',e=>{ if(e.button===0) mouse.down=false; if(e.button===2) mouse.rdown=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; mouse.rdown=false; if(player){ player.buf=null; player.mobBuf=0; } });
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* touch: move stick left, aim stick right, 5-button Warriors cluster + WS satellite */
const TCH={on:false, show:false, ptr:new Map(), move:null, aim:null, held:{}, specDown:0};
const STICK_R=70;
function stickBase(){ return { move:{ox: 92, oy: H - 100}, aim:{ox: W - 90, oy: H - 100} }; }
function tBtns(){
  const r = Math.max(30, Math.min(40, Math.min(W,H)*0.052));
  const cx = W - 90 - STICK_R - r - 26, cy = H - 100;
  const p = player, ms = p && p.set;
  const B = {
    main:   {x:cx,           y:cy - r*0.2,     r:r+8, label:'MAIN',  slot:'main'},
    melee:  {x:cx - r*2.35,  y:cy + r*0.55,    r:r,   label:'MELEE', slot:'melee'},
    special:{x:cx - r*1.55,  y:cy - r*2.1,     r:r,   label:'ART',   slot:'special'},
    move:   {x:cx + r*0.75,  y:cy - r*2.55,    r:r-4, label:'MOVE',  slot:'move'},
    awaken: {x:cx - r*3.85,  y:cy - r*1.2,     r:r-4, label:'AWAKE', slot:'awaken'},
  };
  if(p && p.wg>=100 && wsOf(p)) B.ws = {x:cx - r*3.3, y:cy - r*3.4, r:r, label:'W.SP', slot:'ws'};
  return B;
}
function hitBtn(x,y){const b=tBtns();for(const k in b){if(Math.hypot(x-b[k].x,y-b[k].y)<b[k].r+6)return k;}return null;}
function stickVec(s){if(!s)return null;let dx=s.x-s.ox,dy=s.y-s.oy;const l=Math.hypot(dx,dy)||1;if(l>STICK_R){s.ox=s.x-dx/l*STICK_R;s.oy=s.y-dy/l*STICK_R;dx=s.x-s.ox;dy=s.y-s.oy;}const m=Math.min(1,Math.hypot(dx,dy)/STICK_R);const L=Math.hypot(dx,dy)||1;return{dx:dx/L,dy:dy/L,m};}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType&&e.pointerType!=='touch'&&!G.editBtns)return;
  e.preventDefault(); if(!TCH.on){ TCH.on=true; TCH.show=true; resize(); }
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top, id=e.pointerId;
  if(G.state==='paused'){G.state='play';return;}
  if(G.editBtns){ const m=tBtns().main; TCH.ptr.set(id,'edit'); TCH.editOff={dx:x-m.x,dy:y-m.y}; return; }
  const k=hitBtn(x,y);
  if(k){
    const b=tBtns()[k]; TCH.ptr.set(id,'btn:'+b.slot); TCH.held[b.slot]=1;
    if(b.slot==='special'){ TCH.specDown=performance.now(); return; } // tap=art, long-press=awaken (on release / timer)
    press(b.slot); return;
  }
  const bases=stickBase();
  if(x < W*0.5 && !TCH.move){
    const near = Math.hypot(x-bases.move.ox,y-bases.move.oy)<STICK_R+50;
    TCH.move={id,ox:near?bases.move.ox:x,oy:near?bases.move.oy:y,x,y}; TCH.ptr.set(id,'move');

  ctx.fillRect(-6,-S,11,S*2);

    ctx.fillStyle = metal;
    ctx.fillRect(-5,-3,9,6);

  }
  if(u.foeId==='skel'){
    ctx.fillStyle='#e8e0d0';

    ctx.strokeStyle='#a09888'; ctx.lineWidth=1;

  }
  if(u.foeId==='golem'){

    ctx.fillStyle='#a09070'; ctx.fillRect(-5,-4,9,8);
  }
  if(u.foeId==='slime'){

    ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(10,10); ctx.lineTo(6,2); ctx.fill();

  ctx.beginPath(); ctx.arc(2,0,4.8,0,6.28); ctx.fill();

    // visor slit only (not a face)

  if(u.foeId==='skel'){
    ctx.fillStyle='#e8e0d0';

  if(u.pike){ ctx.strokeStyle='#8a7050'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-2,S-1); ctx.lineTo(24,S-1); ctx.stroke(); ctx.fillStyle=metal; ctx.beginPath(); ctx.moveTo(24,S-3.5); ctx.lineTo(30,S-1); ctx.lineTo(24,S+1.5); ctx.fill(); }

function chgScale(p,q,r){
  const o=Object.assign({},q), m=(k,f)=>{ if(typeof o[k]==='number') o[k]*=f; };

  m('br',1+r); m('w',1+r*0.2); m('dist',1+r*0.5); m('heal',1+r); m('sh2',1+r);
  if(typeof o.n==='number' && ['pj','rn','th','fl','bm','bt','ob','pl','sp','wv','mine','cl'].includes(p)) o.n=Math.max(1,Math.round(o.n*(1+r*0.9)));

    const fn=PRIM[p]; if(!fn){ reportErr(new Error('unknown prim '+p)); continue; }
    const go=()=>{ if(!h.alive) return; const a = q.ka!=null ? h._ka : (q.re ? aimAngle(h) : a0); h.a=a; fn(h,a,q,c); };

/* ---------- 4.1 hero hit reaction ---------- */
// Light hits while you are mid-swing are shrugged off (super armor) so the combo keeps flowing;
// heavy hits stagger, shove you back and cost you the swing. Every hit grants brief i-frames so nothing chain-stuns you.
function heroReact(h,dmg,a){
  const heavy = dmg>=Math.max(30,h.maxhp*0.07);
  h.iframe=Math.max(h.iframe, heavy?0.7:0.45); h.hurtBlink=h.iframe;
  const armor = !heavy && (h.lock>0.04 || !!h.chg);
  hitstop(heavy?0.075:0.04); addShake(heavy?6:2.4); addKick(a,heavy?7:3);
  h.sq=0.22; h.sqA=a; h.sqP=heavy?1.5:0.8;
  addPart({shock:1,x:h.x,y:h.y,r0:6,r1:heavy?72:46,col:'#ff5a4a',t:.22,max:.22,lw:heavy?6:4});
  addPart({burst:1,x:h.x,y:h.y,a:a,n:G.low?5:(heavy?11:7),len:heavy?95:62,col:'#ff6a5a',t:.2,max:.2,seed:Math.random()*9});
  dots(h.x,h.y,heavy?10:5,'#ff6a5a',200,.3);
  G.hurtT=heavy?0.5:0.3;
  if(heavy){ G.slowT=Math.max(G.slowT||0,0.1); }
  if(!armor){ h.chg=null; h.swing=null; h.lock=Math.max(h.lock,heavy?0.34:0.18); h.strT=Math.max(h.strT||0,0.5); h.kvx=Math.cos(a)*(heavy?430:190); h.kvy=Math.sin(a)*(heavy?430:190); }
  else { h.kvx=Math.cos(a)*70; h.kvy=Math.sin(a)*70; }
}
/* soft aim assist: attacks snap toward the nearest foe inside a cone, so strings land without pixel-aiming */
function assistAngle(h,a,c){
  if(G.assist===false || !c || !(c.kind==='str'||c.kind==='br'||c.kind==='art')) return a;
  const R=TCH.on?290:230, cone=TCH.on?2.3:0.8; let best=null,bs=1e9;
  for(const e of enemies){ if(!e.alive||e.prop) continue; const dx=e.x-h.x, dy=e.y-h.y, d=Math.hypot(dx,dy); if(d>R+e.r) continue;
    const off=Math.abs(angDiff(Math.atan2(dy,dx),a)); if(off>cone) continue; const s=d*(1+off*1.3); if(s<bs){ bs=s; best=e; } }
  if(!best) return a;

/* ---------- Warriors-style inputs ---------- */
function speedMul(h){ return h.awk>0 ? 0.72 : 1; }
function press(slot){
  if(!player || G.state!=='play' || isHeld() || (campOn() && CAMP.over)) return;
  const h=player;
  if(h.chg){ if(slot==='move'||slot==='ws'||slot==='awaken') h.chg=null; else return; }
  try{
    if(slot==='ws'){ warriorSpecial(h); return; }
    if(slot==='awaken'){ toggleAwaken(h); return; }
    if(slot==='move'){ if(h.mobCd>0 && h.mobCd<0.25){ h.mobBuf=performance.now(); return; } useMob(h); return; }
    if(h.lock>0.06 || G.cut){ h.buf=slot; h.bufAt=performance.now(); return; }
    if(slot==='main') doMain(h);
    else if(slot==='melee') startBranch(h);
    else if(slot==='special') castArt(h);
    else if(slot==='art2') castArt2(h);
  }catch(err){ reportErr(err); }
}

  const S=h.set.string; if(h.step>=S.length) h.step=0;
  const st=S[h.step];
  h.wpnNow=st.wp||null; runActs(h, st.a, ctxFor(h,'str',st.sch||h.set.school,{step:h.step,heft:st.heft,fin:h.step===S.length-1}));
  h.step++; h.lock=(st.lk||0.26)*speedMul(h)*(h.step>=S.length?1.12:1); h.strT=0.85; h.repAt=gameT+(h.step>=S.length?0.2:0.04);
  h.lastAct='S'+h.step+' · '+st.n; h.lastActT=1.2; noteMove(st.n);

}

  const B=h.set.branch, b=B[Math.min(h.step, branchCap(h)-1)];

/* ---------- update ---------- */
function update(dt){
  const h=player; G._fxN=0;
  if(G.cut){ G.cut.t+=dt; if(G.cut.t>=G.cut.max) G.cut=null; }
  if(G.slowT>0){ G.slowT-=dt; dt*=0.25; }
  gameT+=dt; runSched();
  // hero timers
  h.lock-=dt; h.ctrT=Math.max(0,(h.ctrT||0)-dt); h.artCd=Math.max(0,h.artCd-dt); h.art2Cd=Math.max(0,(h.art2Cd||0)-dt); h.mobCd=Math.max(0,h.mobCd-dt); h.iframe=Math.max(0,h.iframe-dt);
  h.flash=Math.max(0,h.flash-dt); if(h.sq>0) h.sq-=dt; if(h.hurtBlink>0) h.hurtBlink-=dt; if(h.imbue){ h.imbue.t-=dt; if(h.imbue.t<=0) h.imbue=null; else if(Math.random()<dt*16){ const S=SCHOOLS[h.imbue.el]; dots(h.x+(Math.random()-.5)*34,h.y+(Math.random()-.5)*34,1,S?S.color:'#fff',70,.4); } } h.hopT=Math.max(0,h.hopT-dt); h.rollT=Math.max(0,(h.rollT||0)-dt); h.lastActT-=dt;
  if(h.buffs.dmgT>0) h.buffs.dmgT-=dt; if(h.buffs.spdT>0) h.buffs.spdT-=dt;
  if(h.hitT>0){ h.hitT-=dt; if(h.hitT<=0) h.hits=0; }
  if(h.swing){ h.swing.t+=dt; if(h.swing.t>h.swing.dur+0.06) h.swing=null; }
  if(h.lock<=0 && h.strT>0){ h.strT-=dt; if(h.strT<=0) h.step=0; }
  // input window opens in the last ~50ms of recovery; buffered presses expire after 320ms (no stale ghost-attacks)
  if(mouse.down || keys.KeyJ || TCH.held.main) h.holdT=(h.holdT||0)+dt; else h.holdT=0;
  if(h.chg){ const C=h.chg; C.t+=dt; const pr=Math.min(1,Math.max(0,(C.t-0.18)/(C.b.ch||1)));
    if(G.cut||!h.alive){ h.chg=null; }
    else{
      if(pr>=1 && !C.max){ C.max=1; comboBanner('MAX CHARGE',h.x,h.y-70,'#ffffff'); addPart({shock:1,x:h.x,y:h.y,r0:h.r+54,r1:h.r+6,col:'#ffffff',t:.25,max:.25,lw:6}); }
      if(Math.random()<dt*(10+pr*30)) dots(h.x,h.y,1,SCHOOLS[C.b.sch||h.set.school].color,80+pr*120,.35);
      if(!meleeHeld()){ h.chg=null; doBranch(h, C.t<0.18?0:pr); }
    } }
  if(h.lock<=0.05){
    if(h.buf){ const b=h.buf; h.buf=null; if(performance.now()-(h.bufAt||0)<320) press(b); }
    else if(h.holdT>0.14 && gameT>=(h.repAt||0)) press('main');   // holding chains the string at a deliberate cadence
  }
  if(h.mobBuf && h.mobCd<=0){ const tb=performance.now()-h.mobBuf; h.mobBuf=0; if(tb<260) press('move'); }
  if(TCH.specDown && performance.now()-TCH.specDown>480){ TCH.specDown=0; press('awaken'); }
  if(h.awk>0){ h.awk-=dt; if(h.awk<=0) endAwaken(h); }
  if(G.mode!=='camp'){ h.regenT-=dt; if(h.regenT<=0){ h.regenT=1; h.hp=Math.min(h.maxhp,h.hp+12); } }
  // movement
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my-=1; if(keys.KeyS||keys.ArrowDown) my+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
  if(TCH.move){ const v=stickVec(TCH.move); if(v&&v.m>0.12){ mx=v.dx*v.m; my=v.dy*v.m; } }
  const ml=Math.hypot(mx,my); if(ml>1){ mx/=ml; my/=ml; }
  h.mvx=mx; h.mvy=my;
  if(h.tw){ const w=h.tw; w.t+=dt; const f=Math.min(1,w.t/w.dur), e=1-(1-f)*(1-f);
    h.x=w.sx+(w.ex-w.sx)*e; h.y=w.sy+(w.ey-w.sy)*e; if(f>=1) h.tw=null; }
  else {
    const spd=h.spd*(h.awk>0?1.25:1)*(h.buffs.spdT>0?(h.buffs.spd||1):1)*(h.lock>0?0.3:1)*(h.chg?0.55:1);
    const nx=h.x+mx*spd*dt, ny=h.y+my*spd*dt;
    if(walkOk(nx,h.y,h.r*0.7)) h.x=nx; if(walkOk(h.x,ny,h.r*0.7)) h.y=ny;
  }
  if((h.kvx||h.kvy) && !h.tw){ const nx=h.x+h.kvx*dt, ny=h.y+h.kvy*dt; if(walkOk(nx,h.y,h.r*0.7)) h.x=nx; else h.kvx*=-0.3; if(walkOk(h.x,ny,h.r*0.7)) h.y=ny; else h.kvy*=-0.3;
    const dk=Math.exp(-11*dt); h.kvx*=dk; h.kvy*=dk; if(Math.abs(h.kvx)+Math.abs(h.kvy)<8){ h.kvx=0; h.kvy=0; } }

  updateEnemies(dt);
  updateProjectiles(dt);
  updateFields(dt);
  for(let i=wallsTemp.length-1;i>=0;i--){ wallsTemp[i].t-=dt; if(wallsTemp[i].t<=0) wallsTemp.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t-=dt; if(p.vx){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; } if(p.t<=0) parts.splice(i,1); }
  for(let i=dmgNums.length-1;i>=0;i--){ const d=dmgNums[i]; d.t-=dt; d.y-=(d.banner?22:40)*dt; if(d.t<=0) dmgNums.splice(i,1); }
  updateRags(dt);
  for(let i=decals.length-1;i>=0;i--){ decals[i].t-=dt; if(decals[i].t<=0) decals.splice(i,1); } if(G.vigT>0) G.vigT-=dt;
  cam.x+=(h.x-cam.x)*Math.min(1,dt*8); cam.y+=(h.y-cam.y)*Math.min(1,dt*8);
  shake=Math.max(0,shake-dt*40); kickX*=Math.max(0,1-dt*12); kickY*=Math.max(0,1-dt*12); punchZ=Math.max(0,punchZ-dt*0.45); if(G.flashT>0) G.flashT-=dt; if(G.msgT>0) G.msgT-=dt;
  if(campOn()) campUpdate(dt);
}

function updateEnemies(dt){
  const h=player; let dead=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive){ dead++; continue; }
    e.flash=Math.max(0,e.flash-dt); if(e.sq>0) e.sq-=dt; if(e.stag>0) e.stag-=dt;
    for(const k in e.status){ if(e.status[k]>0) e.status[k]-=dt; }
    if(e.brkShow>0) e.brkShow-=dt;
    if(e.broken>0){ e.broken-=dt; if(e.broken<=0){ e.brk=e.brkMax; e.rushed=0; } }
    if(statusHas(e,'burn')){ e.burnT=(e.burnT||0)-dt; if(e.burnT<=0){ e.burnT=0.5; hurt(e,5+(e._heat||0)*2,0,{knock:0,col:'#ff8a3a',owner:null,kind:'dot'}); if(!e.alive) continue; } }
    if(e.hf>0){ e.hf-=dt; if(e.hf<=0){ e.kx=(e.kx||0)+(e.pkx||0); e.ky=(e.ky||0)+(e.pky||0); e.pkx=0; e.pky=0; } else continue; }
    if(e.held){ const a=aimAngle(e.held); e.x=e.held.x+Math.cos(a)*42; e.y=e.held.y+Math.sin(a)*42; e.z=22; e.vz=0; continue; }
    // airborne (juggle)
    if(e.z>0||e.vz>0){ e.vz-=1300*dt; e.z+=e.vz*dt;
      if(e.z<=0){ e.z=0; if(e.vz<-430){ e.vz=-e.vz*0.32; dust(e.x,e.y,20); } else e.vz=0; } }
    // knockback with wall bounce
    if(Math.abs(e.kx)+Math.abs(e.ky)>2){
      const nx=e.x+e.kx*dt, ny=e.y+e.ky*dt;
      if(walkOk(nx,e.y,e.r*0.6)) e.x=nx; else { if(e.wbT>0) wallBounce(e); e.kx*=-0.45; }
      if(walkOk(e.x,ny,e.r*0.6)) e.y=ny; else { if(e.wbT>0) wallBounce(e); e.ky*=-0.45; }
      const dk=Math.exp(-(e.z>4||e.thrown?2.5:7)*dt); e.kx*=dk; e.ky*=dk;
      if(!G.low && e.z<=2 && Math.abs(e.kx)+Math.abs(e.ky)>420 && Math.random()<dt*26) dust(e.x,e.y,8);
    }
    if(e.wbT>0) e.wbT-=dt;
    if(e.thrown){ const th=e.thrown; th.t-=dt;
      for(const o of enemies){ if(o===e||!o.alive||th.hit.has(o)) continue; if(Math.hypot(o.x-e.x,o.y-e.y)<o.r+e.r){ th.hit.add(o); hurt(o,th.d,Math.atan2(o.y-e.y,o.x-e.x),th.o); } }
      if(th.t<=0 || Math.abs(e.kx)+Math.abs(e.ky)<120){ e.thrown=null; explode(th.h,e.x,e.y,80,Q(th.q,{d:th.q.d,up:300}),th.c); hurt(e,th.self,0,Object.assign({},th.o,{up:200})); addShake(6); if(!e.alive) continue; }
    }
    if(e.prop) continue;
    if(e.foeId==='dummy'){ if(G.dummyMove){ e.x+=Math.cos(gameT*1.5+i)*60*dt; } continue; }
    const busy = statusHas(e,'stun')||statusHas(e,'freeze')||e.z>4||e.broken>0||e.stag>0||(campOn()&&(CAMP.introT>0||CAMP.over));
    const dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.tele>0){ e.tele-=dt; if(busy){ e.tele=0; }
      else if(e.tele<=0){ // armored heavy swing
        const rg=e.brkMax>0?70:42;
        addPart({cres:1,x:e.x,y:e.y,a0:e.teleA-0.9,a1:e.teleA+0.9,r:e.r+rg,w:e.brkMax>0?22:12,col:'#ff5050',t:.2,max:.2});
        if(!(e.brkMax>0)){ e.kx+=Math.cos(e.teleA)*240; e.ky+=Math.sin(e.teleA)*240; }
        const pa=Math.atan2(h.y-e.y,h.x-e.x);
        if(d<e.r+h.r+rg && Math.abs(angDiff(pa,e.teleA))<1.0) hurtHero(h, e.boss?(e.p2?180:140):e.brkMax>0?campDmg(e.foeId==='golem'||e.r>=38?90:60):campDmg(26), pa);
        e.atkCd=e.brkMax>0?2.6+Math.random()*1.6:1.8+Math.random()*1.8; }
      continue; }
    if(e.boss && (bossTick(e,dt,h,d,busy)||bossExtra(e,dt,h,d,busy))) continue;
    if(campOn() && !e.boss && aiTick(e,dt,h,d,busy)) continue;
    if(busy) continue;
    e.a=Math.atan2(dy,dx);
    const spd=e.spd*(statusHas(e,'slow')?0.5:1)*(statusHas(e,'root')?0:1)*(statusHas(e,'blind')?0.4:1);
    if(d>e.r+h.r-4){ let vx=dx/d*spd, vy=dy/d*spd;
      // light separation (cheap: only neighbours in index window)
      for(let k=Math.max(0,i-6);k<Math.min(enemies.length,i+7);k++){ const o=enemies[k]; if(o===e||!o.alive) continue; const sx=e.x-o.x, sy=e.y-o.y, sd=Math.hypot(sx,sy); const md=e.r+o.r-6; if(sd<md&&sd>0.1){ vx+=sx/sd*(md-sd)*6; vy+=sy/sd*(md-sd)*6; } }
      const nx=e.x+vx*dt, ny=e.y+vy*dt; if(walkOk(nx,e.y,e.r*0.6)) e.x=nx; if(walkOk(e.x,ny,e.r*0.6)) e.y=ny; }
    e.cd-=dt;
    if(campOn() && !e.boss){ if(e.cw>0){ e.cw-=dt; if(e.cw<=0){ if(d<e.r+h.r+14) hurtHero(h,campDmg(12),e.a); e.cd=0.8; } } else if(d<e.r+h.r+6 && e.cd<=0){ e.cw=0.22; } }
    else if(d<e.r+h.r+6 && e.cd<=0){ e.cd=0.7; hurtHero(h,campOn()?campDmg(e.boss?20:12):8,e.a); }
    if(e.brkMax>0){ e.atkCd-=dt; if(e.atkCd<=0 && d<e.r+h.r+80){ e.tele=e.boss?0.8:0.65; e.teleA=e.a; } }
    else if(campOn()){ e.atkCd-=dt; if(e.atkCd<=0 && d<e.r+h.r+46){ e.tele=0.5; e.teleA=e.a; } }
  }
  // cap corpses (keeps tablet draw cost flat over many waves)

  if(dead>lim){ let rm=dead-lim; for(let i=0;i<enemies.length && rm>0;i++){ const e=enemies[i]; if(!e.alive){ if(e.rag){ const k=rags.indexOf(e.rag); if(k>=0) rags.splice(k,1); } enemies.splice(i,1); i--; rm--; } } }
}
function wallBounce(e){

  comboBanner('WALL BOUNCE!', e.x, e.y-30, '#ffd27a'); addPart({star:1,x:e.x,y:e.y,r:34,col:'#ffd27a',t:.22,max:.22}); addPart({shock:1,x:e.x,y:e.y,r0:6,r1:70,col:'#ffd27a',t:.25,max:.25,lw:7}); addPart({burst:1,x:e.x,y:e.y,n:12,len:90,col:'#ffd27a',t:.22,max:.22,seed:Math.random()*9}); addDecal(e.x,e.y,34,'#ffd27a'); hitstop(0.07); addShake(8); punchZ=Math.max(punchZ,0.035); G.wallBounces++;
  if(e.alive){ e.vz=Math.max(e.vz,260); if(e.z<=0) e.z=1; }
}
function hurtHero(h,dmg,a){

  if(h.iframe>0 || G.cut) return;
  if(h.ctrT>0 && h.ctrQ){ riposte(h,a); return; }
  dmg=Math.round(dmg*(h.awk>0?0.6:1)); if(h.cursed>0) dmg=Math.round(dmg*1.25);
  if(h.shield>0){ const abs=Math.min(h.shield,dmg); h.shield-=abs; dmg-=abs; }
  if(dmg<=0) return;
  if(campOn() && campHeroHit(h,dmg,a)) return;
  h.hp=Math.max(campOn()?0:1,h.hp-dmg); h.flash=0.15; addDmgNum(h.x,h.y-30,dmg,'#ff6060'); G.hurtT=0.45; if(campOn()) styleHurt();
  h.wg=Math.min(100,h.wg+dmg*0.05);
  heroReact(h,dmg,a);

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=dt; let dead=false;
    if(p.polar){ const P=p.polar; const cx=P.fol?P.fol.x:P.cx, cy=P.fol?P.fol.y:P.cy; const r=Math.max(0,P.r0+P.vr*p.t), an=P.a0+P.w*p.t;
      p.x=cx+Math.cos(an)*r; p.y=cy+Math.sin(an)*r; p.a=an+Math.PI/2*(P.w>=0?1:-1);
      if(p.t>=p.life){ if(P.endEx) explode(p.owner,cx,cy,P.endEx,Q(p.q,{up:360}),p.c); dead=true; } }
    else {
      if(p.home){ const e=nearest(p.x,p.y,320); if(e){ const ta=Math.atan2(e.y-p.y,e.x-p.x); p.a+=Math.max(-p.home*dt,Math.min(p.home*dt,angDiff(ta,p.a))); } }
      if(p.boom && p.t>p.life*0.45){ const ta=Math.atan2(p.owner.y-p.by,p.owner.x-p.bx); p.a+=Math.max(-9*dt,Math.min(9*dt,angDiff(ta,p.a))); if(p.t>p.life*0.55 && Math.hypot(p.owner.x-p.bx,p.owner.y-p.by)<30) dead=true; if(p.t>p.life*0.5 && p.hit.size && !p._rh){ p._rh=1; p.hit.clear(); } }
      if(p.acc) p.v=Math.min(1400,p.v+p.acc*dt);
      const nbx=p.bx+Math.cos(p.a)*p.v*dt, nby=p.by+Math.sin(p.a)*p.v*dt;
      if(solidAt(nbx,nby) && !p.boom){
        if(p.bounce>0){ p.bounce--; if(solidAt(nbx,p.by)) p.a=Math.PI-p.a; else p.a=-p.a; p.hit.clear(); dots(p.x,p.y,4,p.col,100,.2); }
        else { if(p.ex) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); else dots(p.x,p.y,4,p.col,100,.2); dead=true; }
      } else { p.bx=nbx; p.by=nby; }
      if(p.wv){ const s=Math.sin(p.t*p.wv.f)*p.wv.amp; p.x=p.bx-Math.sin(p.a)*s; p.y=p.by+Math.cos(p.a)*s; } else { p.x=p.bx; p.y=p.by; }
      if(p.t>=p.life){ if(p.ex && !dead) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); dead=true; }
    }
    if(p.trail){ p.trT-=dt; if(p.trT<=0){ p.trT=0.09; addField({kind:'pool',x:p.x,y:p.y,r:22,dur:1.2,tk:0.3,h:p.owner,c:p.c,q:p.q,d:Math.max(1,Math.round(p.d*0.2)),o:Object.assign({},p.o,{knock:0}),col:p.col,small:1}); } }
    if(!dead){
      for(const e of enemies){ if(!e.alive||p.hit.has(e)) continue;
        const rr=p.r+e.r*0.7; const dx=e.x-p.x, dy=e.y-p.y; if(dx*dx+dy*dy>rr*rr) continue;
        p.hit.add(e); hurt(e,p.d,p.sh==='wave'?p.a:Math.atan2(dy,dx),p.o);
        if(p.jump>0){ const tg=nearest(p.x,p.y,p.jr,p.hit); if(tg){ p.jump--; p.a=Math.atan2(tg.y-p.y,tg.x-p.x); p.bx=p.x; p.by=p.y; p.t=Math.min(p.t,p.life*0.55); addPart({shock:1,x:p.x,y:p.y,r0:4,r1:28,col:p.col,t:.15,max:.15,lw:3}); } else p.jump=0; }
        if(p.sh!=='wave' && p.hit.size<=1) hitstop(0.02);
        if(p.split && !p.splitDone){ p.splitDone=1; for(let k=0;k<p.split;k++){ const q=spawnP(p.owner,p.a+(k-(p.split-1)/2)*0.7+Math.PI*0,Q(p.q,{split:0,d:Math.round((p.q.d||20)*0.6),life:0.45,v:420}),p.c,k); q.bx=q.x=p.x; q.by=q.y=p.y; q.hit.add(e); } }
        if(p.ex){ explode(p.owner,p.x,p.y,p.ex,p.q,p.c); if(!p.pierce){ dead=true; break; } }
        if(p.pierce<=0 && !p.boom && !p.polar){ dead=true; break; }
        p.pierce--;
      }
    }
    if(dead) projectiles.splice(i,1);
  }
}

function updateFields(dt){
  for(let i=fields.length-1;i>=0;i--){
    const f=fields[i]; f.t+=dt;
    if(f.fol){ if(f.kind==='turret'){ f.x=f.fol.x+f.ox; f.y=f.fol.y+f.oy; } else { f.x=f.fol.x; f.y=f.fol.y; } }

function drawCutIn(c){

function genRoom(R, seed){

  AW=dims[0]+(R.kind==='fight'?((rr()*3)|0)*2-2:0); AH=dims[1]; ARENA_W=AW*T; ARENA_H=AH*T;
  grid=[]; props=[];

    if(blocked(x,y)||blocked(x+1,y+1)||blocked(mx,y)||blocked(mx+1,y+1)) continue;

    if(!ok) continue;
    for(const px of [x,mx]){ for(let dy=0;dy<2;dy++) for(let dx=0;dx<2;dx++) grid[y+dy][px+dx]=1; props.push({k:'pillar',tx:px,ty:y,x:(px+1)*T,y:(y+1)*T}); }
    placed+=2;

  // torches on top and bottom walls
  for(let x=3;x<AW-3;x+=5){ if(Math.abs(x+0.5-AW/2)<2.5) continue; props.push({k:'torch',x:(x+.5)*T,y:T*0.62}); props.push({k:'torch',x:(x+.5)*T,y:ARENA_H-T*0.62}); }
  if(th.deco==='banner'){ for(let x=5;x<AW-3;x+=5){ if(Math.abs(x+0.5-AW/2)<3) continue; props.push({k:'wbanner',x:(x+0.5)*T,y:T*0.5}); } }
  // theme decor

  { const nxt=CAMP.plan&&CAMP.plan[R.i+1]; const two=!!(nxt&&nxt.alt); CAMP.doors=two?[{x:AW*T*0.3,y:T*0.5,w:T*2,opt:0},{x:AW*T*0.7,y:T*0.5,w:T*2,opt:1}]:[{x:cxT*T,y:T*0.5,w:T*2,opt:0}]; CAMP.door=CAMP.doors[0]; }
  CAMP.spawn={x:cxT*T, y:ARENA_H-T*2.6};
  CAMP.hazards=[];
  if(R.mod==='burning'){ for(let k=0,g=0;k<7 && g<80;g++){ const x=(2+rr()*(AW-4))*T, y=(2+rr()*(AH-5))*T; if(Math.hypot(x-CAMP.spawn.x,y-CAMP.spawn.y)<260 || solidAt(x,y)) continue; CAMP.hazards.push({x,y,r:46+rr()*34,ph:rr()*6}); k++; } }

}
function buildRoomGround(th){
  groundCv=document.createElement('canvas'); groundCv.width=ARENA_W; groundCv.height=ARENA_H;
  const g=groundCv.getContext('2d');
  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){
    const v=grid[y][x], px=x*T, py=y*T;
    if(v===1){ g.fillStyle=th.wall; g.fillRect(px,py,T,T); g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(px+2,py+2,T-4,T/2-3); g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.strokeRect(px+1,py+1,T-2,T-2);

      if(v===2){ g.strokeStyle='rgba(0,0,0,.28)'; g.lineWidth=1.5; g.beginPath(); const o=(x*7+y*3)%12; g.moveTo(px+6+o,py+8); g.lineTo(px+16+o,py+19); g.lineTo(px+13+o,py+28); g.lineTo(px+24+o,py+40); g.moveTo(px+16+o,py+19); g.lineTo(px+28+o,py+17); g.stroke(); } }
  }

      g.fillStyle=th.wall; g.fillRect(p.x-T+3,p.y-T+3,T*2-6,T*2-6); g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=3; g.strokeRect(p.x-T+3,p.y-T+3,T*2-6,T*2-6);

      g.fillStyle=th.floor[1]; g.beginPath(); g.arc(p.x,p.y,T*0.7,0,6.28); g.fill();
      g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.arc(p.x-T*0.18,p.y-T*0.18,T*0.42,0,6.28); g.fill();
      g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.beginPath(); g.arc(p.x,p.y,T*0.7,0,6.28); g.stroke(); }
    else if(p.k==='wbanner'){ g.fillStyle='#8a2020'; g.fillRect(p.x-12,4,24,T+8); g.beginPath(); g.moveTo(p.x-12,T+12); g.lineTo(p.x,T+2); g.lineTo(p.x+12,T+12); g.fillStyle=th.wall; g.fill(); g.fillStyle='#e0c060'; g.fillRect(p.x-12,4,24,4); g.beginPath(); g.arc(p.x,T*0.55,5,0,6.28); g.fill(); }

function itemInfo(it){ const ex=itemInfoEx(it); if(ex) return ex;

}
function itemRarity(it){
  if(it.kind==='mob') return 'common';
  if(it.kind==='art'){ const m=byId(ARTS,it.id); return m.cd<=7?'common':m.cd<=9?'rare':'epic'; }
  if(it.kind==='set'){ const m=byId(MOVESETS,it.id); return (m.heft||1)>=1.2?'epic':'rare'; }
  if(it.kind==='ws') return it.id===player.set.id?'rare':'epic';

  return 'common';
}
function rewardPool(){
  const C=CAMP, U=C.unlocked, P=[];
  for(const m of MOVESETS) if(!U.set.has(m.id)) P.push({kind:'set',id:m.id});
  for(const a of ARTS) if(!U.art.has(a.id)) P.push({kind:'art',id:a.id});
  for(const b of MOBS) if(!U.mob.has(b.id)) P.push({kind:'mob',id:b.id});
  for(const m of MOVESETS) if(!U.ws.has(m.id)) P.push({kind:'ws',id:m.id});
  if(C.branchLv<6) P.push({kind:'fin',id:'C'+(C.branchLv+1),lv:C.branchLv+1});
  for(const it of P) it.rar=itemRarity(it);

function rollOffers(roomIdx, treasure){
  const C=CAMP, r=rngFor(C.seed,'reward'+roomIdx+(C.plan[roomIdx].v?'b':'')), R=C.plan[roomIdx];
  const pool=rewardPool(), out=[], W=bonusW(RAR_W[roomIdx]||RAR_W[3],R);
  const order=['common','rare','epic'];
  const pickOne=(minRar)=>{
    let x=r()*100, rar=x<W[0]?'common':x<W[0]+W[1]?'rare':'epic';
    if(minRar && order.indexOf(rar)<order.indexOf(minRar)) rar=minRar;
    const kinds=new Set(out.map(o=>o.kind));
    for(let s=0;s<3;s++){ const want=order[(order.indexOf(rar)+s)%3];
      let cand=pool.filter(p=>p.rar===want && !out.includes(p) && !kinds.has(p.kind));
      if(!cand.length) cand=pool.filter(p=>p.rar===want && !out.includes(p));
      if(cand.length){ const it=cand[(r()*cand.length)|0]; out.push(it); return it; } }
    return null;
  };
  if(treasure && R.kind==='rest'){ restOffers(out,r); }
  else if(treasure && R.kind==='shrine'){ shrineOffers(out,r); }
  else if(treasure){
    if(!relicPick(out,r,'rare')) pickOne('rare');
    out.push({kind:'stat',id:rPick(r,['hp','atk','spd']),rar:'rare'});
    out.push({kind:'heal',id:'heal',rar:'common'});
  } else {
    for(let k=0;k<(hasRelic('coin')?4:3);k++) pickOne(null);
    const has=(rr)=>out.some(o=>order.indexOf(o.rar)>=order.indexOf(rr));
    if(R.kind==='elite' && !has('rare')){ out.pop(); pickOne('rare'); }
    if(R.kind==='horde' && !has('epic')){ out.pop(); pickOne('epic'); }
    if((R.kind==='elite'||R.bonus) && !out.some(o=>o.kind==='relic')) relicPick(out,r,R.mini?'rare':null,true);
    else if(!out.some(o=>o.kind==='relic') && r()<0.3) relicPick(out,r,null,true);
  }
  C.offersLog.push({room:roomIdx+1, offers:out.map(o=>o.kind+':'+o.id+':'+o.rar)});
  return out.filter(Boolean);
}

function syncCampUI(){
  const camp=G.mode==='camp';
  const dev=$('btnDev'), nx=$('btnNext'), lt=$('btnToggle');
  if(dev) dev.classList.toggle('hide',!camp || loadoutOpen);
  if(loadoutOpen){ const p=$('devPanel'); if(p) p.classList.add('hide'); }
  if(lt) lt.classList.toggle('hide',G.mode==='title');
  if(!camp){ const p=$('devPanel'); if(p) p.classList.add('hide'); }
  if(nx){ let show=false, label='NEXT ROOM ▶';
    if(camp && CAMP && !CAMP.over && !G.overlay){ const R=CAMP.plan[CAMP.room];
      if(CAMP.doorOpen && CAMP.room<CAMP.N-1) show=true;
      else if(isChestRoom(R) && !CAMP.chestOpen){ show=true; label='OPEN CHEST'; } }
    nx.classList.toggle('hide',!show); nx.textContent=label; }
  const gs=$('devGod'); if(gs && CAMP) gs.textContent='GOD MODE: '+(CAMP.god?'ON':'OFF');
}
function devAction(k){
  if(!campOn()) return;
  const C=CAMP;
  if(k==='skip'){ if(C.over) return; const R=C.plan[C.room]; if(isChestRoom(R)){ if(!C.chestOpen) openChest(); return; } C.pending=[]; for(const e of enemies) if(e.alive) killFoe(e,Math.random()*TAU,700); C.introT=0; }
  if(k==='boss'){ if(C.over) return; for(let j=C.room+1;j<C.N;j++){ C.plan[j].alt=null; } enterRoom(C.N-1); }
  if(k==='god'){ C.god=!C.god; toast('GOD MODE '+(C.god?'ON':'OFF')); }
  if(k==='seed'){ toast('SEED '+C.seed+' · room '+(C.room+1)+'/'+C.N); }
  if(k==='win'){ campWin(); }
  if(k==='lose'){ campDefeat(); }
  if(k==='unlock'){ unlockAll(); }
  if(k==='gauge'){ player.ag=100; player.wg=100; toast('Gauges full (Last Stand armed)'); }
  if(k==='low'){ setLow(!G.low); toast(G.low?'LOW graphics ON':'LOW graphics OFF'); }
  if(k==='title'){ showTitle(); }
  syncCampUI();
}
function initCampUI(){
  $('btnReroll').onclick=()=>{ G.seed=newSeed(); $('seedIn').value=G.seed; showTitle(); };
  $('btnCamp').onclick=()=>{ const v=$('seedIn').value.trim(); startCampaign(v||G.seed); };

      const k=0.5+0.5*Math.sin(t*4); ctx.strokeStyle='rgba(255,224,138,'+(0.3+0.4*k).toFixed(3)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(c.x,c.y,58+k*8,0,TAU); ctx.stroke(); } }

function drawModIcon(mod,x,y,s){
  const M=MODS[mod]; if(!M) return; ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(0,0,s,0,TAU); ctx.fill(); ctx.strokeStyle=M.col; ctx.fillStyle=M.col; ctx.lineWidth=2;

  if(mod==='fog'){ for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(-s*0.6,i*s*0.4); ctx.quadraticCurveTo(-s*0.2,i*s*0.4-4,0,i*s*0.4); ctx.quadraticCurveTo(s*0.2,i*s*0.4+4,s*0.6,i*s*0.4); ctx.stroke(); } }
  else if(mod==='burning'){ ctx.beginPath(); ctx.moveTo(0,-s*0.65); ctx.quadraticCurveTo(s*0.55,0,0,s*0.6); ctx.quadraticCurveTo(-s*0.55,0,0,-s*0.65); ctx.fill(); }
  else if(mod==='frost'){ for(let i=0;i<3;i++){ const a=i*Math.PI/3; ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.65,Math.sin(a)*s*0.65); ctx.lineTo(-Math.cos(a)*s*0.65,-Math.sin(a)*s*0.65); ctx.stroke(); } }
  else if(mod==='ambush'){ for(const o of [-0.25,0.25]){ ctx.beginPath(); ctx.moveTo(-s*0.45,(o-0.2)*s); ctx.lineTo(0,(o+0.2)*s); ctx.lineTo(s*0.45,(o-0.2)*s); ctx.stroke(); } }
  ctx.restore();
}

function makeRoomDef(r,i,kind,theme,risky){
  const T0=THEMES[theme]; const R={i,kind,theme,mod:null,types:[],roster:[],elite:null,bonus:0,v:0,mini:0,alt:null};
  const chestK=(kind==='treasure'||kind==='rest'||kind==='shrine');
  const POOL=['fog','burning','frost','ambush','barrels','nomercy','storm'];
  if(!chestK && kind!=='boss' && i>0 && r()<(risky?0.92:0.24)) R.mod=rPick(r,POOL);
  if(kind==='horde' && !R.mod && r()<0.45) R.mod='ambush';
  if(kind==='boss' && r()<0.3) R.mod=rPick(r,['fog','burning','frost','storm']);
  if(!chestK && kind!=='boss' && risky){ if(!R.mod) R.mod=rPick(r,POOL); R.bonus=1; }
  if(R.mod==='nomercy') R.bonus=1;
  if(!chestK){
    const nT = i===0 ? 2 : 2+((r()*3)|0);
    R.types = rShuffle(r,T0.pool).slice(0,Math.min(nT,T0.pool.length));
    if(kind==='horde'){ const n=30+((r()*11)|0); for(let k=0;k<n;k++){ let id=rPick(r,R.types); if(foeCost(id)>=4 && r()<0.6) id=R.types.find(t=>foeCost(t)<4)||id; R.roster.push(id); } }
    else if(kind==='boss'){ for(let k=0;k<4;k++) R.roster.push(rPick(r,R.types.filter(t=>foeCost(t)<4).concat(T0.pool.filter(t=>foeCost(t)<4)).slice(0,4))); }
    else { let budget=Math.round(8+i*2); let guard=0; while(budget>0 && guard++<80){ const id=rPick(r,R.types); const c=foeCost(id); if(c>budget && budget<4){ R.roster.push(R.types.find(t=>foeCost(t)===1)||id); budget--; continue; } R.roster.push(id); budget-=c; } }
    if(kind==='elite') R.elite=rPick(r,T0.elite);
  }

}
function makePlan(seed){
  const r=rngFor(seed,'plan');

  const order=[th[0],th[0],th[1],th[1],th[2],th[2],th[3],th[3],th[4],th[4]];
  const plan=[];
  for(let i=0;i<NROOMS;i++){
    const pool=KIND_POOLS[i];
    const A=makeRoomDef(r,i,pool[0],order[i],false);
    if(i===3){ A.mini=1; const T0=THEMES[A.theme]; const oth=T0.elite.filter(x=>x!==A.elite); A.elite2=oth.length?rPick(r,oth):A.elite; }
    if(pool.length>1){
      const kb=pool[1+((r()*(pool.length-1))|0)];
      const others=THEME_KEYS.filter(k=>k!==order[i]);

}

/* ================= 3.9 — high-quality combat effects ================= */
const hx39=c=>(typeof c==='string'&&/^#[0-9a-fA-F]{3,6}$/.test(c))?c:'#ffffff';
function soft39(x,y,r,col,a){ if(a<=0.01||r<1) return; ctx.globalAlpha=Math.min(1,a); ctx.drawImage(gspr(hx39(col)),x-r,y-r,r*2,r*2); }
function kite39(x0,y0,x1,y1,hw,mid){ const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,nx=-dy/L*hw,ny=dx/L*hw,mx=x0+dx*mid,my=y0+dy*mid;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(mx+nx,my+ny); ctx.lineTo(x1,y1); ctx.lineTo(mx-nx,my-ny); ctx.closePath(); }
const ez39=t=>1-Math.pow(1-t,3);

/* tapered, swept crescent blade with white-hot core and sparkle tail */
function cres39(p){
  const k=Math.max(0,p.t/(p.max||p.t||1)), pr=1-k;
  const x=p.fol?p.fol.x:p.x, y=p.fol?p.fol.y:p.y;
  const a0=p.a0, span=p.a1-p.a0;
  const head=ez39(Math.min(1,pr*2.4)), tail=Math.max(0,(pr-0.28)/0.72);
  if(head<=tail+0.015) return;
  const r=p.r, w=Math.max(9,p.w||16)*1.25, fade=Math.min(1,k*2.4);
  const N=G.low?12:22, pts=[];
  for(let i=0;i<=N;i++){ const t=i/N, u=tail+(head-tail)*t, ang=a0+span*u;
    pts.push({c:Math.cos(ang),s:Math.sin(ang),th:w*Math.pow(t,0.75)*(1-Math.pow(t,6))*1.3}); }
  ctx.save(); if(p.vert){ ctx.translate(x,y); ctx.scale(1,0.55); ctx.translate(-x,-y); }
  ctx.globalCompositeOperation='lighter';
  const draw=(mul,col,al)=>{ ctx.beginPath();
    for(let i=0;i<=N;i++){ const q=pts[i], rr=r+q.th*0.28*mul; i?ctx.lineTo(x+q.c*rr,y+q.s*rr):ctx.moveTo(x+q.c*rr,y+q.s*rr); }
    for(let i=N;i>=0;i--){ const q=pts[i], rr=r-q.th*0.72*mul; ctx.lineTo(x+q.c*rr,y+q.s*rr); }
    ctx.closePath(); ctx.globalAlpha=al*fade; ctx.fillStyle=col; ctx.fill(); };
  if(!G.low) draw(2.1,p.col,0.16);
  draw(1.25,p.col,0.55);
  draw(0.8,p.col,0.8);
  draw(0.36,'#ffffff',0.95);
  // glowing head flare
  const hq=pts[N-1]||pts[N], hr=r-w*0.2; soft39(x+hq.c*hr,y+hq.s*hr,w*1.5,p.col,0.7*fade); soft39(x+hq.c*hr,y+hq.s*hr,w*0.7,'#ffffff',0.6*fade);
  // sparkle motes shed along the blade
  if(!G.low){ p._sd=p._sd||Math.random()*100;
    for(let i=0;i<5;i++){ const t=(i+0.5)/5, u=tail+(head-tail)*t, ang=a0+span*u; const sh=Math.sin(p._sd+i*7.7); const rr=r+sh*w*0.9+pr*14*(i%2?1:-1);
      soft39(x+Math.cos(ang)*rr,y+Math.sin(ang)*rr,4+3*Math.abs(sh),i%2?'#ffffff':p.col,0.7*fade*(1-t*0.4)); } }
  ctx.restore(); ctx.globalAlpha=1;
}

function burst39(p){
  const k=Math.max(0,p.t/(p.max||p.t||1)), pr=1-k, n=p.n||10;
  const R0=p.len*(0.1+0.5*ez39(pr)), R1=p.len*(0.28+0.75*ez39(pr));
  ctx.save(); ctx.globalCompositeOperation='lighter';
  soft39(p.x,p.y,p.len*0.55*(0.6+0.6*pr),p.col,0.75*k*k); soft39(p.x,p.y,p.len*0.28,'#ffffff',0.8*k*k);
  ctx.strokeStyle=p.col; ctx.globalAlpha=0.55*k; ctx.lineWidth=2.5*k+0.5; ctx.beginPath(); ctx.arc(p.x,p.y,R1*0.8,0,TAU); ctx.stroke();
  for(let i=0;i<n;i++){
    const an=(p.a!=null? p.a+(i/(n-1)-.5)*2.4 : i/n*TAU)+Math.sin(i*12.9898+(p.seed||0))*0.18, rl=0.55+0.45*Math.abs(Math.sin(i*78.233+(p.seed||0)));
    const c=Math.cos(an), s=Math.sin(an), x0=p.x+c*R0, y0=p.y+s*R0, x1=p.x+c*(R0+(R1-R0)*rl), y1=p.y+s*(R0+(R1-R0)*rl);
    const hw=(i%2?1.6:3)*k+0.4;
    ctx.globalAlpha=0.9*Math.min(1,k*1.8); ctx.fillStyle=p.col; kite39(x0,y0,x1,y1,hw,0.25); ctx.fill();
    ctx.globalAlpha=Math.min(1,k*2); ctx.fillStyle='#fff'; kite39(x0,y0,x1,y1,hw*0.38,0.25); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

function slash39(p){
  const k=Math.max(0,p.t/(p.max||p.t||1)), pr=1-k, L=p.len*(0.45+0.75*ez39(pr)), dx=Math.cos(p.a), dy=Math.sin(p.a);
  const x0=p.x-dx*L*0.35, y0=p.y-dy*L*0.35, x1=p.x+dx*L, y1=p.y+dy*L;
  ctx.save(); ctx.globalCompositeOperation='lighter';

  if(!G.low){ ctx.globalAlpha=0.3*k; ctx.fillStyle=p.col; kite39(x0,y0,x1,y1,10*k+2,0.4); ctx.fill(); }
  ctx.globalAlpha=Math.min(1,k*1.8); ctx.fillStyle=p.col; kite39(x0,y0,x1,y1,5*k+1.2,0.4); ctx.fill();
  ctx.globalAlpha=Math.min(1,k*2.2); ctx.fillStyle='#fff'; kite39(x0,y0,x1,y1,2*k+0.6,0.4); ctx.fill();
