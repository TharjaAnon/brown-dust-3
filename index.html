/* ---------- arena (fantasy) ---------- */
const T=48; let AW=42, AH=28;
let ARENA_W=AW*T, ARENA_H=AH*T;
let grid=[], props=[], groundCv=null;
function genArena(){
  AW=42; AH=28; ARENA_W=AW*T; ARENA_H=AH*T; G.bgCol='#1a2a18';
  grid=[]; props=[];
  for(let y=0;y<AH;y++){
    grid[y]=[];
    for(let x=0;x<AW;x++){
      let v=0;
      if(x===0||y===0||x===AW-1||y===AH-1) v=1;
      else if(((x+y*3)%17)===0 && x>3&&y>3&&x<AW-4&&y<AH-4) v=1;
      else if(Math.hypot(x-AW/2,y-AH/2)<5) v=3;
      else if((x%9===4 && y>4 && y<AH-4) || (y%8===3 && x>4 && x<AW-4)) v=2;
      grid[y][x]=v;
    }
  }
  const spots=[[5,5],[8,21],[35,6],[36,22],[12,14],[29,17],[6,12],[38,14]];
  for(const[tx,ty] of spots){ if(grid[ty]&&grid[ty][tx]===0){ grid[ty][tx]=5; props.push({k:'tree',x:(tx+.5)*T,y:(ty+.5)*T}); } }
  buildGround();
}
function buildGround(){
  // pre-render static ground once (big tablet win vs 1176 fillRects/frame)
  groundCv = document.createElement('canvas');
  groundCv.width = ARENA_W; groundCv.height = ARENA_H;
  const g = groundCv.getContext('2d');
  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){
    const v=grid[y][x], px=x*T, py=y*T;
    if(v===1){ g.fillStyle='#5a5348'; g.fillRect(px,py,T,T); g.fillStyle='#3a342c'; g.fillRect(px+4,py+4,T-8,T-8); g.fillStyle='#6a6356'; g.fillRect(px+4,py+4,T-8,5); }
    else if(v===2){ g.fillStyle='#6b5a3e'; g.fillRect(px,py,T,T); g.fillStyle='#75644a'; g.fillRect(px+((x*7)%30),py+((y*11)%30),6,4); }
    else if(v===3){ g.fillStyle='#7a7260'; g.fillRect(px,py,T,T); g.strokeStyle='#4a4438'; g.strokeRect(px+2,py+2,T-4,T-4); }
    else { g.fillStyle = ((x+y)&1) ? '#3d6b34' : '#457a3c'; g.fillRect(px,py,T,T);
      g.fillStyle='#4f8a44'; if(((x*13+y*7)%5)===0) g.fillRect(px+10,py+18,3,7); }
  }
  // central rune circle
  g.strokeStyle='rgba(255,230,160,.25)'; g.lineWidth=3;
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,4.2*T,0,6.28); g.stroke();
  g.beginPath(); g.arc(ARENA_W/2,ARENA_H/2,3.2*T,0,6.28); g.stroke();
  for(const p of props){
    g.fillStyle='#2a4a20'; g.beginPath(); g.arc(p.x,p.y,20,0,6.28); g.fill();
    g.fillStyle='#5a3a18'; g.fillRect(p.x-4,p.y,8,14);
    g.fillStyle='#3d7a30'; g.beginPath(); g.arc(p.x,p.y-6,17,0,6.28); g.fill();
  }
}
function solidAt(x,y){
  const tx=Math.floor(x/T), ty=Math.floor(y/T);
  if(ty<0||tx<0||ty>=AH||tx>=AW) return true;
  const v=grid[ty][tx];
  if(v===1 || v===5) return true;
  for(const w of wallsTemp){ if(Math.abs(x-w.x)<w.hw && Math.abs(y-w.y)<w.hw) return true; }
  return false;
}
function walkOk(x,y,r){
  return !solidAt(x-r,y)&&!solidAt(x+r,y)&&!solidAt(x,y-r)&&!solidAt(x,y+r);
}

/* touch: move stick left, aim stick right, 5-button Warriors cluster + WS satellite */
const TCH={on:false, show:false, ptr:new Map(), move:null, aim:null, held:{}, specDown:0};
const STICK_R=70;
function stickBase(){ return { move:{ox: 92, oy: H - 100}, aim:{ox: W - 90, oy: H - 100} }; }
function tBtns(){
  const r = Math.max(30, Math.min(40, Math.min(W,H)*0.052));
  const cx = W - 90 - STICK_R - r - 26, cy = H - 100;
  const p = player, ms = p && p.set;
  const B = {
    main:   {x:cx,           y:cy - r*0.2,     r:r+8, label:'MAIN',  slot:'main'},
    melee:  {x:cx - r*2.35,  y:cy + r*0.55,    r:r,   label:'MELEE', slot:'melee'},
    special:{x:cx - r*1.55,  y:cy - r*2.1,     r:r,   label:'ART',   slot:'special'},
    move:   {x:cx + r*0.75,  y:cy - r*2.55,    r:r-4, label:'MOVE',  slot:'move'},
    awaken: {x:cx - r*3.85,  y:cy - r*1.2,     r:r-4, label:'AWAKE', slot:'awaken'},
  };
  if(p && p.wg>=100 && wsOf(p)) B.ws = {x:cx - r*3.3, y:cy - r*3.4, r:r, label:'W.SP', slot:'ws'};
  return B;
}
function hitBtn(x,y){const b=tBtns();for(const k in b){if(Math.hypot(x-b[k].x,y-b[k].y)<b[k].r+6)return k;}return null;}
function stickVec(s){if(!s)return null;let dx=s.x-s.ox,dy=s.y-s.oy;const l=Math.hypot(dx,dy)||1;if(l>STICK_R){s.ox=s.x-dx/l*STICK_R;s.oy=s.y-dy/l*STICK_R;dx=s.x-s.ox;dy=s.y-s.oy;}const m=Math.min(1,Math.hypot(dx,dy)/STICK_R);const L=Math.hypot(dx,dy)||1;return{dx:dx/L,dy:dy/L,m};}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType&&e.pointerType!=='touch'&&!G.editBtns)return;
  e.preventDefault(); if(!TCH.on){ TCH.on=true; TCH.show=true; resize(); }
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top, id=e.pointerId;
  if(G.state==='paused'){G.state='play';return;}
  if(G.editBtns){ const m=tBtns().main; TCH.ptr.set(id,'edit'); TCH.editOff={dx:x-m.x,dy:y-m.y}; return; }
  const k=hitBtn(x,y);
  if(k){
    const b=tBtns()[k]; TCH.ptr.set(id,'btn:'+b.slot); TCH.held[b.slot]=1;
    if(b.slot==='special'){ TCH.specDown=performance.now(); return; } // tap=art, long-press=awaken (on release / timer)
    press(b.slot); return;
  }
  const bases=stickBase();
  if(x < W*0.5 && !TCH.move){
    const near = Math.hypot(x-bases.move.ox,y-bases.move.oy)<STICK_R+50;
    TCH.move={id,ox:near?bases.move.ox:x,oy:near?bases.move.oy:y,x,y}; TCH.ptr.set(id,'move');
  }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType&&e.pointerType!=='touch'&&!G.editBtns)return;
  e.preventDefault();
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  const role=TCH.ptr.get(e.pointerId); if(!role)return;
  if(role==='move'&&TCH.move){TCH.move.x=x;TCH.move.y=y;}
  if(role==='edit'&&TCH.editOff){ G.btnAx=(x-TCH.editOff.dx)/W; G.btnAy=(y-TCH.editOff.dy)/H; const m=tBtns().main; G.btnAx=m.x/W; G.btnAy=m.y/H; }
},{passive:false});
function tUp(e){
  if(e.pointerType&&e.pointerType!=='touch'&&!G.editBtns)return;
  const role=TCH.ptr.get(e.pointerId); TCH.ptr.delete(e.pointerId);
  if(role==='move')TCH.move=null;
  else if(role==='aim')TCH.aim=null;
  else if(role&&role.startsWith('btn:')){
    const s=role.slice(4); TCH.held[s]=0;
    if(s==='special' && TCH.specDown){ TCH.specDown=0; press('special'); }
  }
}
cv.addEventListener('pointerup',tUp,{passive:false});

/* Fantasy-reskinned faceless humanoid draw (ported feel from Micro Rivals drawHuman, no faces) */
function drawFoeSprite(u, lod){
  const cloth = u.col || '#6a7a98';

  const metal = u.ring || '#c9a84a';

  ctx.rotate(u.a||0);

  ctx.beginPath(); ctx.ellipse(2,3,11,7,0,0,6.28); ctx.fill();

  ctx.fillStyle = u.kind==='monster' && u.foeId==='skel' ? '#d8d0c0' : (u.bot||'#2c2c30');
  ctx.fillRect(-4,-6,7,4); ctx.fillRect(-4,2,7,4);
  // torso / armor
  ctx.fillStyle = cloth;
  ctx.fillRect(-6,-S,11,S*2);
  if(u.kind==='armor' || u.foeId==='knight'){
    // breastplate highlight + shoulder plates
    ctx.fillStyle = metal;
    ctx.fillRect(-5,-3,9,6);
    ctx.fillRect(-8,-S,3,5); ctx.fillRect(5,-S+1,3,5);
  }
  if(u.foeId==='skel'){
    ctx.fillStyle='#e8e0d0';
    ctx.fillRect(-5,-S+2,9,S*2-4);
    ctx.strokeStyle='#a09888'; ctx.lineWidth=1;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-4,-4+i*3); ctx.lineTo(4,-4+i*3); ctx.stroke(); }
  }
  if(u.foeId==='golem'){
    ctx.fillStyle='#6a5a40'; ctx.fillRect(-8,-S-1,15,S*2+2);
    ctx.fillStyle='#a09070'; ctx.fillRect(-5,-4,9,8);
  }
  if(u.foeId==='slime'){
    ctx.restore();
    ctx.beginPath(); ctx.arc(u.x,u.y,u.r,0,6.28);
    ctx.fillStyle=cloth; ctx.fill();
    ctx.strokeStyle=u.ring; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(u.x-4,u.y-4,4,0,6.28); ctx.fill();
    return;
  }
  if(u.foeId==='wisp'){
    ctx.restore();
    const g=ctx.createRadialGradient(u.x,u.y,2,u.x,u.y,u.r+8);
    g.addColorStop(0,'#fff'); g.addColorStop(.4,cloth); g.addColorStop(1,'rgba(0,0,0,0)');

    ctx.fillStyle=cloth; ctx.beginPath(); ctx.arc(u.x,u.y,u.r*.6,0,6.28); ctx.fill();
    return;
  }
  if(u.foeId==='shade'){
    ctx.globalAlpha=.85;
    ctx.fillStyle=cloth; ctx.fillRect(-7,-S-2,13,S*2+4);
  }
  if(u.foeId==='imp'){
    // horns (no face)
    ctx.fillStyle='#802020';
    ctx.beginPath(); ctx.moveTo(4,-4); ctx.lineTo(10,-10); ctx.lineTo(6,-2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(10,10); ctx.lineTo(6,2); ctx.fill();
  }
  // arms
  ctx.fillStyle = u.foeId==='knight' ? metal : cloth;
  ctx.fillRect(0,-S-1,9,3.5); ctx.fillRect(0,S-2.5,9,3.5);
  // head — faceless oval / helmet (NO face features)
  ctx.fillStyle = (u.foeId==='knight') ? metal : skin;
  ctx.beginPath(); ctx.arc(2,0,4.8,0,6.28); ctx.fill();
  if(u.foeId==='knight'){
    // visor slit only (not a face)
    ctx.fillStyle='#1a1a22';
    ctx.fillRect(3,-2.2,2.2,4.4);
    // plume
    ctx.fillStyle='#c04040';
    ctx.fillRect(-1,-1.5,2,3);
  }
  if(u.foeId==='skel'){
    ctx.fillStyle='#e8e0d0';
    ctx.beginPath(); ctx.arc(2,0,4.6,0,6.28); ctx.fill();
    // empty sockets as dark marks — still faceless abstract
    ctx.fillStyle='#2a2820';
    ctx.fillRect(2.5,-2,1.6,1.6); ctx.fillRect(2.5,1,1.6,1.6);
  }
  if(u.ears){ ctx.fillStyle=skin; ctx.beginPath(); ctx.moveTo(0,-3.5); ctx.lineTo(-3,-10); ctx.lineTo(3.5,-4); ctx.fill(); ctx.beginPath(); ctx.moveTo(0,3.5); ctx.lineTo(-3,10); ctx.lineTo(3.5,4); ctx.fill(); }
  if(u.helm){ ctx.fillStyle=metal; ctx.beginPath(); ctx.arc(2,0,5.4,0,6.28); ctx.fill(); ctx.fillStyle='#1a1a22'; ctx.fillRect(4,-2.2,2,4.4); }
  if(u.hood){ ctx.fillStyle='#1e0810'; ctx.beginPath(); ctx.arc(1.5,0,6.2,0,6.28); ctx.fill(); ctx.beginPath(); ctx.moveTo(-3,-4); ctx.lineTo(-10,0); ctx.lineTo(-3,4); ctx.fill(); ctx.strokeStyle=metal; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(1.5,0,6.2,-1,1); ctx.stroke(); }
  if(u.horns){ ctx.fillStyle=u.crown?'#2a1a10':'#401008'; ctx.beginPath(); ctx.moveTo(3,-4); ctx.lineTo(9,-11); ctx.lineTo(6,-2); ctx.fill(); ctx.beginPath(); ctx.moveTo(3,4); ctx.lineTo(9,11); ctx.lineTo(6,2); ctx.fill(); }
  if(u.spikes){ ctx.fillStyle='#d8f2ff'; for(const sy of [-1,1]){ ctx.beginPath(); ctx.moveTo(-4,sy*(S-1)); ctx.lineTo(-9,sy*(S+5)); ctx.lineTo(1,sy*(S-1)); ctx.fill(); } }
  if(u.crown){ ctx.strokeStyle=metal; ctx.fillStyle=metal; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(2,0,6.4,0,6.28); ctx.stroke(); for(let k=0;k<5;k++){ const a=k/5*6.28; ctx.beginPath(); ctx.moveTo(2+Math.cos(a-0.25)*6.4,Math.sin(a-0.25)*6.4); ctx.lineTo(2+Math.cos(a)*9.5,Math.sin(a)*9.5); ctx.lineTo(2+Math.cos(a+0.25)*6.4,Math.sin(a+0.25)*6.4); ctx.fill(); } }
  if(u.pike){ ctx.strokeStyle='#8a7050'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-2,S-1); ctx.lineTo(24,S-1); ctx.stroke(); ctx.fillStyle=metal; ctx.beginPath(); ctx.moveTo(24,S-3.5); ctx.lineTo(30,S-1); ctx.lineTo(24,S+1.5); ctx.fill(); }
  if(u.foeId==='dummy'){
    ctx.fillStyle='#8a6840';
    ctx.fillRect(-6,-S,11,S*2);
    ctx.fillStyle='#c4a882';
    ctx.beginPath(); ctx.arc(2,0,5,0,6.28); ctx.fill();
    ctx.strokeStyle='#5a4020'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(2,0,5,0,6.28); ctx.stroke();
  }
  // flash
  if(u.flash>0){ ctx.globalAlpha=Math.min(1,u.flash*8); ctx.fillStyle='#fff'; ctx.fillRect(-8,-10,16,20); }
  ctx.restore();
  // HP bar
  if(u.alive && u.hp < u.maxhp) hpBar(u,14);
}

/* ---------- ragdoll (ported/simplified from Micro Rivals 7.3) ---------- */
const RAG_MAX_HARD=40;
const RAG_K=0.58, RAG_KL=0.46;
const ARMS={extended:[[12,13],[17,23]],bent:[[6,13],[14,7]],under:[[4,6],[-1,2]],tucked:[[2,8],[10,5]],side:[[0,12],[-8,12]]};
const LEGS={straight:[[-14,4],[-24,5],[-14,-4],[-24,-5]],onebent:[[-8,12],[-18,10],[-14,-4],[-24,-5]],bothbent:[[-6,9],[-16,4],[-6,-9],[-16,-4]],splayed:[[-13,7],[-21,12],[-13,-7],[-21,-12]]};
const ARMK=Object.keys(ARMS), LEGK=Object.keys(LEGS);

function liveSkel(u){
  const S=12, a=u.a||0, ca=Math.cos(a), sa=Math.sin(a);
  const L=[[2,0],[3,0],[-4,0],[12,-S+2],[10,S-3],[.5,-4],[.5,4],[5,-S],[5,S-2],[-1,-3.5],[-1,3.5]];

}
function ragBlock(x,y){ return solidAt(x,y); }
function pickPose(){
  const R=Math.random;
  return {aL:ARMK[(R()*ARMK.length)|0], aR:ARMK[(R()*ARMK.length)|0], legs:LEGK[(R()*LEGK.length)|0], tw:[-1,0,1][(R()*3)|0], hd:[-1,0,1][(R()*3)|0]};
}
function spawnRag(u, a, killPow){
  killPow = killPow||260;
  const live=liveSkel(u);
  const c=pickPose();
  let ha=(u.a!=null?u.a:a+Math.PI)+(Math.random()-.5)*.6;
  const hx=Math.cos(ha), hy=Math.sin(ha), mir=Math.random()<.5?-1:1, lx=-hy*mir, ly=hx*mir;
  const v0=killPow*.68*(killPow>=600?1.4:1)*(.9+Math.random()*.2);
  const vx=Math.cos(a)*v0, vy=Math.sin(a)*v0;
  const arm=(k,side)=>{const A=ARMS[k]; return A.map(([f,l])=>[f,l*side]);};
  const aL=arm(c.aL,1), aR=arm(c.aR,-1), Lg=LEGS[c.legs];
  const tw=c.tw*.3+(Math.random()-.5)*.15, ct=Math.cos(tw), st=Math.sin(tw);
  const rot=([f,l])=>[-4+(f+4)*ct-l*st,(f+4)*st+l*ct];
  let head=[16,c.hd*3.5], chest=[8,0];
  const loc=[rot(head),rot(chest),[-4,0],rot(aL[1]),rot(aR[1]),Lg[1],Lg[3],rot(aL[0]),rot(aR[0]),Lg[0],Lg[2]]
    .map(([f,l],k)=>{const K=k>2?RAG_KL:RAG_K; return[-4+(f+4)*K,l*K];});
  const ox=u.x, oy=u.y, RS=u.ragSc||1;
  const pts=loc.map(([f,l],k)=>{
    const j=k>2?2.5:k===0?1:0;
    const ff=f+(Math.random()-.5)*2*j, ll=l+(Math.random()-.5)*2*j;
    const x=ox+(hx*ff+lx*ll)*RS, y=oy+(hy*ff+ly*ll)*RS;
    return{x,y,px:x-vx/60,py:y-vy/60};
  });
  for(const p of pts) if(ragBlock(p.x,p.y)){p.x=ox;p.y=oy;p.px=ox-vx/60;p.py=oy-vy/60;}
  const con=[]; for(let i=0;i<pts.length;i++) for(let k=i+1;k<pts.length;k++) con.push([i,k,Math.hypot(pts[i].x-pts[k].x,pts[i].y-pts[k].y)]);
  const P0=pts[2], tgt=pts.map(p=>({x:p.x-P0.x,y:p.y-P0.y}));
  let lv=live.map(p=>({x:(p.x-live[2].x)*RS,y:(p.y-live[2].y)*RS}));
  const lp=live[2], vxp=P0.px-P0.x, vyp=P0.py-P0.y;
  for(let k=0;k<pts.length;k++){const p=pts[k]; p.x=lp.x+lv[k].x; p.y=lp.y+lv[k].y; p.px=p.x+vxp; p.py=p.y+vyp;}
  const dur=.75+Math.random()*.15;
  const lag=pts.map((_,k)=>k===2||k===1?0:k===0?.08:k<7?.18+Math.random()*.08:.1+Math.random()*.06);
  u.rag={pts,con,frozen:false,still:0,age:0,bt:0,anim:{t:0,dur,live:lv,tgt,lag,dx:Math.cos(a),dy:Math.sin(a),hit:false,ph:Math.random()*6},h:1,cloth:u.col,skin:u.skin||'#c9b09a',metal:u.ring,foeId:u.foeId,kind:u.kind,sc:RS};
  rags.push(u.rag);
  const lim = Math.min(G.ragMax, RAG_MAX_HARD);
  const act=rags.filter(r=>!r.frozen);
  if(act.length>lim) for(let i=0;i<act.length-lim;i++) freezeRag(act[i]);
}
function freezeRag(r){ if(r.anim) finishAnim(r); r.frozen=true; for(const p of r.pts){p.px=p.x;p.py=p.y;} }
function animOff(r,k,t){
  const A=r.anim, lv=A.live[k], tg=A.tgt[k]; const T1=.15, T2=.6;
  const j=Math.sin(Math.PI*Math.min(t,.3)/.3); let jx=0,jy=0;
  if(k===1){jx=A.dx*1.5;jy=A.dy*1.5;}
  else if(k===0){jx=A.dx*7;jy=A.dy*7;}
  else if(k>=3&&k!==5&&k!==6&&k<9){const ox=lv.x-A.live[1].x,oy=lv.y-A.live[1].y,ol=Math.hypot(ox,oy)||1; jx=ox/ol*7+A.dx*3; jy=oy/ol*7+A.dy*3;}
  if(t<T1) return{x:lv.x+jx*j,y:lv.y+jy*j};
  const sx=lv.x+jx, sy=lv.y+jy;
  if(t<T2){const u=(t-T1)/(T2-T1), L=A.lag[k]; let e=Math.max(0,(u-L)/(1-L)); e=e*e;
    const jf=Math.max(0,1-u*1.4); const bx=lv.x+jx*Math.max(jf,0), by=lv.y+jy*Math.max(jf,0);

function chgScale(p,q,r){
  const o=Object.assign({},q), m=(k,f)=>{ if(typeof o[k]==='number') o[k]*=f; };

  m('br',1+r); m('w',1+r*0.2); m('dist',1+r*0.5); m('heal',1+r); m('sh2',1+r);
  if(typeof o.n==='number' && ['pj','rn','th','fl','bm','bt','ob','pl','sp','wv','mine','cl'].includes(p)) o.n=Math.max(1,Math.round(o.n*(1+r*0.9)));

function runActs(h, acts, c){

  for(const act of acts){

    const fn=PRIM[p]; if(!fn){ reportErr(new Error('unknown prim '+p)); continue; }
    const go=()=>{ if(!h.alive) return; const a = q.ka!=null ? h._ka : (q.re ? aimAngle(h) : a0); h.a=a; fn(h,a,q,c); };

/* ---------- 4.1 hero hit reaction ---------- */
// Light hits while you are mid-swing are shrugged off (super armor) so the combo keeps flowing;
// heavy hits stagger, shove you back and cost you the swing. Every hit grants brief i-frames so nothing chain-stuns you.
function heroReact(h,dmg,a){
  const heavy = dmg>=Math.max(30,h.maxhp*0.07);
  h.iframe=Math.max(h.iframe, heavy?0.7:0.45); h.hurtBlink=h.iframe;
  const armor = !heavy && (h.lock>0.04 || !!h.chg);
  hitstop(heavy?0.075:0.04); addShake(heavy?6:2.4); addKick(a,heavy?7:3);
  h.sq=0.22; h.sqA=a; h.sqP=heavy?1.5:0.8;
  addPart({shock:1,x:h.x,y:h.y,r0:6,r1:heavy?72:46,col:'#ff5a4a',t:.22,max:.22,lw:heavy?6:4});
  addPart({burst:1,x:h.x,y:h.y,a:a,n:G.low?5:(heavy?11:7),len:heavy?95:62,col:'#ff6a5a',t:.2,max:.2,seed:Math.random()*9});
  dots(h.x,h.y,heavy?10:5,'#ff6a5a',200,.3);
  G.hurtT=heavy?0.5:0.3;
  if(heavy){ G.slowT=Math.max(G.slowT||0,0.1); }
  if(!armor){ h.chg=null; h.swing=null; h.lock=Math.max(h.lock,heavy?0.34:0.18); h.strT=Math.max(h.strT||0,0.5); h.kvx=Math.cos(a)*(heavy?430:190); h.kvy=Math.sin(a)*(heavy?430:190); }
  else { h.kvx=Math.cos(a)*70; h.kvy=Math.sin(a)*70; }
}
/* soft aim assist: attacks snap toward the nearest foe inside a cone, so strings land without pixel-aiming */
function assistAngle(h,a,c){
  if(G.assist===false || !c || !(c.kind==='str'||c.kind==='br'||c.kind==='art')) return a;
  const R=TCH.on?290:230, cone=TCH.on?2.3:0.8; let best=null,bs=1e9;
  for(const e of enemies){ if(!e.alive||e.prop) continue; const dx=e.x-h.x, dy=e.y-h.y, d=Math.hypot(dx,dy); if(d>R+e.r) continue;
    const off=Math.abs(angDiff(Math.atan2(dy,dx),a)); if(off>cone) continue; const s=d*(1+off*1.3); if(s<bs){ bs=s; best=e; } }
  if(!best) return a;

/* ---------- Warriors-style inputs ---------- */
function speedMul(h){ return h.awk>0 ? 0.72 : 1; }
function press(slot){
  if(!player || G.state!=='play' || isHeld() || (campOn() && CAMP.over)) return;
  const h=player;
  if(h.chg){ if(slot==='move'||slot==='ws'||slot==='awaken') h.chg=null; else return; }
  try{
    if(slot==='ws'){ warriorSpecial(h); return; }
    if(slot==='awaken'){ toggleAwaken(h); return; }
    if(slot==='move'){ if(h.mobCd>0 && h.mobCd<0.25){ h.mobBuf=performance.now(); return; } useMob(h); return; }
    if(h.lock>0.06 || G.cut){ h.buf=slot; h.bufAt=performance.now(); return; }
    if(slot==='main') doMain(h);
    else if(slot==='melee') startBranch(h);
    else if(slot==='special') castArt(h);
    else if(slot==='art2') castArt2(h);
  }catch(err){ reportErr(err); }
}

  const S=h.set.string; if(h.step>=S.length) h.step=0;
  const st=S[h.step];
  h.wpnNow=st.wp||null; runActs(h, st.a, ctxFor(h,'str',st.sch||h.set.school,{step:h.step,heft:st.heft,fin:h.step===S.length-1}));
  h.step++; h.lock=(st.lk||0.26)*speedMul(h)*(h.step>=S.length?1.12:1); h.strT=0.85; h.repAt=gameT+(h.step>=S.length?0.2:0.04);
  h.lastAct='S'+h.step+' · '+st.n; h.lastActT=1.2; noteMove(st.n);
  G.stats.str++;
  if(h.step>=S.length){ h.strT=0.5; }
}

  const B=h.set.branch, b=B[Math.min(h.step, branchCap(h)-1)];

}

}
function castArt(h){

  runActs(h, A.a, ctxFor(h,'art',A.school));

  gameT+=dt; runSched();

function updateEnemies(dt){
  const h=player; let dead=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive){ dead++; continue; }
    e.flash=Math.max(0,e.flash-dt); if(e.sq>0) e.sq-=dt; if(e.stag>0) e.stag-=dt;

    if(e.brkShow>0) e.brkShow-=dt;
    if(e.broken>0){ e.broken-=dt; if(e.broken<=0){ e.brk=e.brkMax; e.rushed=0; } }
    if(statusHas(e,'burn')){ e.burnT=(e.burnT||0)-dt; if(e.burnT<=0){ e.burnT=0.5; hurt(e,5+(e._heat||0)*2,0,{knock:0,col:'#ff8a3a',owner:null,kind:'dot'}); if(!e.alive) continue; } }
    if(e.hf>0){ e.hf-=dt; if(e.hf<=0){ e.kx=(e.kx||0)+(e.pkx||0); e.ky=(e.ky||0)+(e.pky||0); e.pkx=0; e.pky=0; } else continue; }
    if(e.held){ const a=aimAngle(e.held); e.x=e.held.x+Math.cos(a)*42; e.y=e.held.y+Math.sin(a)*42; e.z=22; e.vz=0; continue; }
    // airborne (juggle)
    if(e.z>0||e.vz>0){ e.vz-=1300*dt; e.z+=e.vz*dt;
      if(e.z<=0){ e.z=0; if(e.vz<-430){ e.vz=-e.vz*0.32; dust(e.x,e.y,20); } else e.vz=0; } }
    // knockback with wall bounce
    if(Math.abs(e.kx)+Math.abs(e.ky)>2){
      const nx=e.x+e.kx*dt, ny=e.y+e.ky*dt;
      if(walkOk(nx,e.y,e.r*0.6)) e.x=nx; else { if(e.wbT>0) wallBounce(e); e.kx*=-0.45; }
      if(walkOk(e.x,ny,e.r*0.6)) e.y=ny; else { if(e.wbT>0) wallBounce(e); e.ky*=-0.45; }
      const dk=Math.exp(-(e.z>4||e.thrown?2.5:7)*dt); e.kx*=dk; e.ky*=dk;
      if(!G.low && e.z<=2 && Math.abs(e.kx)+Math.abs(e.ky)>420 && Math.random()<dt*26) dust(e.x,e.y,8);
    }
    if(e.wbT>0) e.wbT-=dt;

    }

    const busy = statusHas(e,'stun')||statusHas(e,'freeze')||e.z>4||e.broken>0||e.stag>0||(campOn()&&(CAMP.introT>0||CAMP.over));
    const dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.tele>0){ e.tele-=dt; if(busy){ e.tele=0; }
      else if(e.tele<=0){ // armored heavy swing
        const rg=e.brkMax>0?70:42;
        addPart({cres:1,x:e.x,y:e.y,a0:e.teleA-0.9,a1:e.teleA+0.9,r:e.r+rg,w:e.brkMax>0?22:12,col:'#ff5050',t:.2,max:.2});
        if(!(e.brkMax>0)){ e.kx+=Math.cos(e.teleA)*240; e.ky+=Math.sin(e.teleA)*240; }
        const pa=Math.atan2(h.y-e.y,h.x-e.x);
        if(d<e.r+h.r+rg && Math.abs(angDiff(pa,e.teleA))<1.0) hurtHero(h, e.boss?(e.p2?180:140):e.brkMax>0?campDmg(e.foeId==='golem'||e.r>=38?90:60):campDmg(26), pa);
        e.atkCd=e.brkMax>0?2.6+Math.random()*1.6:1.8+Math.random()*1.8; }
      continue; }

    else if(d<e.r+h.r+6 && e.cd<=0){ e.cd=0.7; hurtHero(h,campOn()?campDmg(e.boss?20:12):8,e.a); }
    if(e.brkMax>0){ e.atkCd-=dt; if(e.atkCd<=0 && d<e.r+h.r+80){ e.tele=e.boss?0.8:0.65; e.teleA=e.a; } }

}

function hurtHero(h,dmg,a){

  if(h.iframe>0 || G.cut) return;

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=dt; let dead=false;
    if(p.polar){ const P=p.polar; const cx=P.fol?P.fol.x:P.cx, cy=P.fol?P.fol.y:P.cy; const r=Math.max(0,P.r0+P.vr*p.t), an=P.a0+P.w*p.t;
      p.x=cx+Math.cos(an)*r; p.y=cy+Math.sin(an)*r; p.a=an+Math.PI/2*(P.w>=0?1:-1);
      if(p.t>=p.life){ if(P.endEx) explode(p.owner,cx,cy,P.endEx,Q(p.q,{up:360}),p.c); dead=true; } }
    else {
      if(p.home){ const e=nearest(p.x,p.y,320); if(e){ const ta=Math.atan2(e.y-p.y,e.x-p.x); p.a+=Math.max(-p.home*dt,Math.min(p.home*dt,angDiff(ta,p.a))); } }
      if(p.boom && p.t>p.life*0.45){ const ta=Math.atan2(p.owner.y-p.by,p.owner.x-p.bx); p.a+=Math.max(-9*dt,Math.min(9*dt,angDiff(ta,p.a))); if(p.t>p.life*0.55 && Math.hypot(p.owner.x-p.bx,p.owner.y-p.by)<30) dead=true; if(p.t>p.life*0.5 && p.hit.size && !p._rh){ p._rh=1; p.hit.clear(); } }
      if(p.acc) p.v=Math.min(1400,p.v+p.acc*dt);
      const nbx=p.bx+Math.cos(p.a)*p.v*dt, nby=p.by+Math.sin(p.a)*p.v*dt;
      if(solidAt(nbx,nby) && !p.boom){
        if(p.bounce>0){ p.bounce--; if(solidAt(nbx,p.by)) p.a=Math.PI-p.a; else p.a=-p.a; p.hit.clear(); dots(p.x,p.y,4,p.col,100,.2); }
        else { if(p.ex) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); else dots(p.x,p.y,4,p.col,100,.2); dead=true; }
      } else { p.bx=nbx; p.by=nby; }
      if(p.wv){ const s=Math.sin(p.t*p.wv.f)*p.wv.amp; p.x=p.bx-Math.sin(p.a)*s; p.y=p.by+Math.cos(p.a)*s; } else { p.x=p.bx; p.y=p.by; }
      if(p.t>=p.life){ if(p.ex && !dead) explode(p.owner,p.x,p.y,p.ex,p.q,p.c); dead=true; }
    }
    if(p.trail){ p.trT-=dt; if(p.trT<=0){ p.trT=0.09; addField({kind:'pool',x:p.x,y:p.y,r:22,dur:1.2,tk:0.3,h:p.owner,c:p.c,q:p.q,d:Math.max(1,Math.round(p.d*0.2)),o:Object.assign({},p.o,{knock:0}),col:p.col,small:1}); } }
    if(!dead){
      for(const e of enemies){ if(!e.alive||p.hit.has(e)) continue;
        const rr=p.r+e.r*0.7; const dx=e.x-p.x, dy=e.y-p.y; if(dx*dx+dy*dy>rr*rr) continue;
        p.hit.add(e); hurt(e,p.d,p.sh==='wave'?p.a:Math.atan2(dy,dx),p.o);
        if(p.jump>0){ const tg=nearest(p.x,p.y,p.jr,p.hit); if(tg){ p.jump--; p.a=Math.atan2(tg.y-p.y,tg.x-p.x); p.bx=p.x; p.by=p.y; p.t=Math.min(p.t,p.life*0.55); addPart({shock:1,x:p.x,y:p.y,r0:4,r1:28,col:p.col,t:.15,max:.15,lw:3}); } else p.jump=0; }
        if(p.sh!=='wave' && p.hit.size<=1) hitstop(0.02);
        if(p.split && !p.splitDone){ p.splitDone=1; for(let k=0;k<p.split;k++){ const q=spawnP(p.owner,p.a+(k-(p.split-1)/2)*0.7+Math.PI*0,Q(p.q,{split:0,d:Math.round((p.q.d||20)*0.6),life:0.45,v:420}),p.c,k); q.bx=q.x=p.x; q.by=q.y=p.y; q.hit.add(e); } }
        if(p.ex){ explode(p.owner,p.x,p.y,p.ex,p.q,p.c); if(!p.pierce){ dead=true; break; } }
        if(p.pierce<=0 && !p.boom && !p.polar){ dead=true; break; }
        p.pierce--;
      }
    }
    if(dead) projectiles.splice(i,1);
  }
}

function updateFields(dt){
  for(let i=fields.length-1;i>=0;i--){
    const f=fields[i]; f.t+=dt;
    if(f.fol){ if(f.kind==='turret'){ f.x=f.fol.x+f.ox; f.y=f.fol.y+f.oy; } else { f.x=f.fol.x; f.y=f.fol.y; } }
    if(f.vx){ const nx=f.x+f.vx*dt, ny=f.y+f.vy*dt; if(!solidAt(nx,ny)){ f.x=nx; f.y=ny; } else { f.vx=-f.vx; f.vy=-f.vy; } }
    if(f.kind==='vortex'){ for(const e of inCirc(f.x,f.y,f.r*1.5)){ if(e.brkMax>0&&!(e.broken>0)) continue; const dx=f.x-e.x, dy=f.y-e.y, d=Math.hypot(dx,dy)||1; if(d>12){ e.x+=dx/d*f.pull*dt; e.y+=dy/d*f.pull*dt; } } }

    if(f.kind==='mine'){ if(f.fuse!=null){ f.fuse-=dt; if(f.fuse<=0) f.t=f.dur; } else if(f.t>f.arm && inCirc(f.x,f.y,f.trig).length) f.fuse=0.06; }

      if(f.kind==='pillar'||f.kind==='pool'||f.kind==='vortex'){
        const L=inCirc(f.x,f.y,f.r); const first=f.first; f.first=0;
        for(const e of L) hurt(e, first?f.d:Math.max(1,Math.round(f.d*(f.kind==='pillar'?0.35:1))), Math.atan2(e.y-f.y,e.x-f.x), first?f.o1:f.o);
        if(first && L.length) hitstop(0.04);
      } else if(f.kind==='beam'){
        for(const e of inLine(f.x,f.y,f.a,f.len,f.w+12)) hurt(e,f.d,f.a,f.o);
      } else if(f.kind==='turret'){
        const e=nearest(f.x,f.y,340);
        if(e){ const a=Math.atan2(e.y-f.y,e.x-f.x); const q=f.q; const p=spawnP(f.h,a,Q(q,{sh:q.sh||'shard',v:q.v||620,life:0.7,d:q.d||14}),f.c,0); p.x=p.bx=f.x; p.y=p.by=f.y; }

    if(!ok) continue;

  // torches on top and bottom walls

  if(th.deco==='banner'){ for(let x=5;x<AW-3;x+=5){ if(Math.abs(x+0.5-AW/2)<3) continue; props.push({k:'wbanner',x:(x+0.5)*T,y:T*0.5}); } }

  { const nxt=CAMP.plan&&CAMP.plan[R.i+1]; const two=!!(nxt&&nxt.alt); CAMP.doors=two?[{x:AW*T*0.3,y:T*0.5,w:T*2,opt:0},{x:AW*T*0.7,y:T*0.5,w:T*2,opt:1}]:[{x:cxT*T,y:T*0.5,w:T*2,opt:0}]; CAMP.door=CAMP.doors[0]; }

  if(R.mod==='burning'){ for(let k=0,g=0;k<7 && g<80;g++){ const x=(2+rr()*(AW-4))*T, y=(2+rr()*(AH-5))*T; if(Math.hypot(x-CAMP.spawn.x,y-CAMP.spawn.y)<260 || solidAt(x,y)) continue; CAMP.hazards.push({x,y,r:46+rr()*34,ph:rr()*6}); k++; } }

function buildRoomGround(th){
  groundCv=document.createElement('canvas'); groundCv.width=ARENA_W; groundCv.height=ARENA_H;

  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++){
    const v=grid[y][x], px=x*T, py=y*T;

      g.fillStyle=th.floor[1]; g.beginPath(); g.arc(p.x,p.y,T*0.7,0,6.28); g.fill();
      g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.arc(p.x-T*0.18,p.y-T*0.18,T*0.42,0,6.28); g.fill();
      g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.beginPath(); g.arc(p.x,p.y,T*0.7,0,6.28); g.stroke(); }
    else if(p.k==='wbanner'){ g.fillStyle='#8a2020'; g.fillRect(p.x-12,4,24,T+8); g.beginPath(); g.moveTo(p.x-12,T+12); g.lineTo(p.x,T+2); g.lineTo(p.x+12,T+12); g.fillStyle=th.wall; g.fill(); g.fillStyle='#e0c060'; g.fillRect(p.x-12,4,24,4); g.beginPath(); g.arc(p.x,T*0.55,5,0,6.28); g.fill(); }

function itemInfo(it){ const ex=itemInfoEx(it); if(ex) return ex;

  return {type:'?',name:'?',school:null,desc:'',extra:''};
}
function itemRarity(it){
  if(it.kind==='mob') return 'common';
  if(it.kind==='art'){ const m=byId(ARTS,it.id); return m.cd<=7?'common':m.cd<=9?'rare':'epic'; }
  if(it.kind==='set'){ const m=byId(MOVESETS,it.id); return (m.heft||1)>=1.2?'epic':'rare'; }
  if(it.kind==='ws') return it.id===player.set.id?'rare':'epic';
  if(it.kind==='fin') return ['common','rare','epic'][it.lv-4]||'rare';
  return 'common';
}
function rewardPool(){
  const C=CAMP, U=C.unlocked, P=[];
  for(const m of MOVESETS) if(!U.set.has(m.id)) P.push({kind:'set',id:m.id});
  for(const a of ARTS) if(!U.art.has(a.id)) P.push({kind:'art',id:a.id});
  for(const b of MOBS) if(!U.mob.has(b.id)) P.push({kind:'mob',id:b.id});
  for(const m of MOVESETS) if(!U.ws.has(m.id)) P.push({kind:'ws',id:m.id});
  if(C.branchLv<6) P.push({kind:'fin',id:'C'+(C.branchLv+1),lv:C.branchLv+1});
  for(const it of P) it.rar=itemRarity(it);
  return P;

function rollOffers(roomIdx, treasure){
  const C=CAMP, r=rngFor(C.seed,'reward'+roomIdx+(C.plan[roomIdx].v?'b':'')), R=C.plan[roomIdx];
  const pool=rewardPool(), out=[], W=bonusW(RAR_W[roomIdx]||RAR_W[3],R);
  const order=['common','rare','epic'];
  const pickOne=(minRar)=>{
    let x=r()*100, rar=x<W[0]?'common':x<W[0]+W[1]?'rare':'epic';
    if(minRar && order.indexOf(rar)<order.indexOf(minRar)) rar=minRar;
    const kinds=new Set(out.map(o=>o.kind));
    for(let s=0;s<3;s++){ const want=order[(order.indexOf(rar)+s)%3];
      let cand=pool.filter(p=>p.rar===want && !out.includes(p) && !kinds.has(p.kind));
      if(!cand.length) cand=pool.filter(p=>p.rar===want && !out.includes(p));
      if(cand.length){ const it=cand[(r()*cand.length)|0]; out.push(it); return it; } }
    return null;
  };
  if(treasure && R.kind==='rest'){ restOffers(out,r); }
  else if(treasure && R.kind==='shrine'){ shrineOffers(out,r); }
  else if(treasure){
    if(!relicPick(out,r,'rare')) pickOne('rare');
    out.push({kind:'stat',id:rPick(r,['hp','atk','spd']),rar:'rare'});
    out.push({kind:'heal',id:'heal',rar:'common'});
  } else {
    for(let k=0;k<(hasRelic('coin')?4:3);k++) pickOne(null);
    const has=(rr)=>out.some(o=>order.indexOf(o.rar)>=order.indexOf(rr));
    if(R.kind==='elite' && !has('rare')){ out.pop(); pickOne('rare'); }
    if(R.kind==='horde' && !has('epic')){ out.pop(); pickOne('epic'); }
    if((R.kind==='elite'||R.bonus) && !out.some(o=>o.kind==='relic')) relicPick(out,r,R.mini?'rare':null,true);
    else if(!out.some(o=>o.kind==='relic') && r()<0.3) relicPick(out,r,null,true);
  }
  C.offersLog.push({room:roomIdx+1, offers:out.map(o=>o.kind+':'+o.id+':'+o.rar)});
  return out.filter(Boolean);
}

function devAction(k){

function makeRoomDef(r,i,kind,theme,risky){
  const T0=THEMES[theme]; const R={i,kind,theme,mod:null,types:[],roster:[],elite:null,bonus:0,v:0,mini:0,alt:null};
  const chestK=(kind==='treasure'||kind==='rest'||kind==='shrine');
  const POOL=['fog','burning','frost','ambush','barrels','nomercy','storm'];
  if(!chestK && kind!=='boss' && i>0 && r()<(risky?0.92:0.24)) R.mod=rPick(r,POOL);
  if(kind==='horde' && !R.mod && r()<0.45) R.mod='ambush';
  if(kind==='boss' && r()<0.3) R.mod=rPick(r,['fog','burning','frost','storm']);
  if(!chestK && kind!=='boss' && risky){ if(!R.mod) R.mod=rPick(r,POOL); R.bonus=1; }
  if(R.mod==='nomercy') R.bonus=1;
  if(!chestK){
    const nT = i===0 ? 2 : 2+((r()*3)|0);
    R.types = rShuffle(r,T0.pool).slice(0,Math.min(nT,T0.pool.length));
    if(kind==='horde'){ const n=30+((r()*11)|0); for(let k=0;k<n;k++){ let id=rPick(r,R.types); if(foeCost(id)>=4 && r()<0.6) id=R.types.find(t=>foeCost(t)<4)||id; R.roster.push(id); } }
    else if(kind==='boss'){ for(let k=0;k<4;k++) R.roster.push(rPick(r,R.types.filter(t=>foeCost(t)<4).concat(T0.pool.filter(t=>foeCost(t)<4)).slice(0,4))); }
    else { let budget=Math.round(8+i*2); let guard=0; while(budget>0 && guard++<80){ const id=rPick(r,R.types); const c=foeCost(id); if(c>budget && budget<4){ R.roster.push(R.types.find(t=>foeCost(t)===1)||id); budget--; continue; } R.roster.push(id); budget-=c; } }
    if(kind==='elite') R.elite=rPick(r,T0.elite);

}
function makePlan(seed){
  const r=rngFor(seed,'plan');

  const order=[th[0],th[0],th[1],th[1],th[2],th[2],th[3],th[3],th[4],th[4]];
  const plan=[];
  for(let i=0;i<NROOMS;i++){
    const pool=KIND_POOLS[i];
    const A=makeRoomDef(r,i,pool[0],order[i],false);
    if(i===3){ A.mini=1; const T0=THEMES[A.theme]; const oth=T0.elite.filter(x=>x!==A.elite); A.elite2=oth.length?rPick(r,oth):A.elite; }
    if(pool.length>1){

}

    if(S.k==='dash'){ e.a=S.a; const ok=moveFoe(e,Math.cos(S.a)*S.sp,Math.sin(S.a)*S.sp,dt);
      if(!G.low) addPart({ghost:1,x:e.x,y:e.y,r:e.r,col:e.col,t:.2,max:.2});
      if(!S.hit && Math.hypot(h.x-e.x,h.y-e.y)<e.r+h.r*0.8){ S.hit=true; hurtHero(h,campDmg(S.dmg),S.a); }
      if(!ok){ dazed(e,2.0,true); return true; }

    if(S.k==='vanish'){ if(S.t<=0){ const ba=h.a+Math.PI; let p=clampPt(h.x+Math.cos(ba)*95,h.y+Math.sin(ba)*95); if(!walkOk(p.x,p.y,e.r)) p=freeSpot(h.x,h.y,90,170);
        dots(e.x,e.y,8,'#a070d0',160,.4); e.x=p.x; e.y=p.y; e.inv=0; e.tele=0.5; e.teleA=Math.atan2(h.y-e.y,h.x-e.x);
        addPart({shock:1,x:e.x,y:e.y,r0:e.r+30,r1:e.r,col:'#c090ff',t:.3,max:.3,lw:5}); e.aiS=null; e.aiCd=5+Math.random()*2; } return true; }
    e.aiS=null; return false;
  }
  if(k==='pike'){ if(e.aiCd<=0 && d<200 && d>60){ e.aiS={k:'pike',t:0.75,a}; e.a=a; return true; } return false; }
  if(k==='charge'||k==='pounce'){ const ch=k==='charge';
    if(e.aiCd<=0 && d>110 && d<(ch?430:300)){ e.aiS={k:'cwind',t:ch?0.65:0.5,max:ch?0.65:0.5,a,sp:ch?580:500,dur:ch?0.5:0.32,dmg:ch?24:16,len:ch?330:170}; return true; } return false; }
  if(k==='blink'){ if(e.aiCd<=0 && d>200){ e.aiS={k:'vanish',t:0.55}; e.inv=1; return true; } return false; }
  const P=RNG_AI[k];
  if(P){
    let vx=0,vy=0; const sp=e.spd*sl;

    else if(d>P.rp[1]){ vx=Math.cos(a)*sp; vy=Math.sin(a)*sp; }
    else { if(!e._sd) e._sd=Math.random()<.5?1:-1; vx=-Math.sin(a)*sp*0.55*e._sd; vy=Math.cos(a)*sp*0.55*e._sd; }

  }
  return false;

/* ---------------- enemy projectiles ---------------- */
function updateEProj(dt){
  const h=player;
  for(let i=eprojs.length-1;i>=0;i--){
    const p=eprojs[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    let dead=p.t>=p.life || solidAt(p.x,p.y);
    if(!dead && h && Math.hypot(h.x-p.x,h.y-p.y)<p.r+h.r*0.6){
      if(h.pdT>0 || (h.iframe<=0 && !(h.hopT>0))){
        const hp0=h.hp+h.shield; hurtHero(h,p.dmg,Math.atan2(p.vy,p.vx));
        if(p.curse && h.hp+h.shield<hp0){ h.cursed=6; comboBanner('CURSED · Light cleanses',h.x,h.y-64,'#c090ff'); }
        if(p.slow && h.hp+h.shield<hp0){ h.buffs.spd=0.6; h.buffs.spdT=p.slow; }
        dead=true;
      }
    }
    if(dead){ dots(p.x,p.y,5,p.col,120,.25); eprojs.splice(i,1); }
  }
}
function drawEProj(vis){
  for(const p of eprojs){ if(!vis(p.x,p.y,40)) continue;
    const a=Math.atan2(p.vy,p.vx);
    for(let k=3;k>=1;k--){ ctx.globalAlpha=0.18*(4-k); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x-Math.cos(a)*k*7,p.y-Math.sin(a)*k*7,p.r*(1-k*0.14),0,TAU); ctx.fill(); }
    ctx.globalAlpha=1; glow(14,p.col); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); noGlow();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.45,0,TAU); ctx.fill(); }
}

/* ---------------- zones (storm, boss telegraphs, lingering ice) ---------------- */
function inZone(z,o){ if(z.k==='c') return Math.hypot(o.x-z.x,o.y-z.y)<z.r+o.r*0.3; return segDist(o.x,o.y,z.x0,z.y0,z.x1,z.y1)<z.w/2+o.r*0.4; }
function resolveZone(z,h){
  const col=z.col;
  if(inZone(z,h) && !(h.hopT>0)) hurtHero(h,z.dmg,0);
  if(z.foe){ for(const q of enemies) if(q.alive&&!q.prop&&inZone(z,q)) hurt(q,z.fdmg||100,Math.atan2(q.y-(z.y||z.y0),q.x-(z.x||z.x0)),{owner:null,knock:260,up:240,col,kind:'dot'}); }
  if(z.k==='c'){
    addPart({shock:1,x:z.x,y:z.y,r0:8,r1:z.r*1.1,col,t:.3,max:.3,lw:8}); addPart({burst:1,x:z.x,y:z.y,n:G.low?6:12,len:z.r*1.2,col,t:.24,max:.24,seed:Math.random()*9}); addDecal(z.x,z.y,z.r*0.7,col); addShake(4);
    if(z.bolt) addPart({bolt:1,x:z.x,y:z.y,h:280,w:4,col,seed:Math.random()*999,t:.25,max:.25});
    if(z.burn){ CAMP.hazards.push({x:z.x,y:z.y,r:z.r*0.8,ph:Math.random()*6,ttl:5}); }
  } else { addPart({streak:1,x0:z.x0,y0:z.y0,x1:z.x1,y1:z.y1,w:z.w,col,t:.3,max:.3}); addShake(3); }
}
function updateZones(dt){
  const C=CAMP, h=player, Z=C.zones;
  for(let i=Z.length-1;i>=0;i--){ const z=Z[i]; z.t+=dt;
    if(!z.done && z.t>=z.delay){ z.done=1; resolveZone(z,h); if(!z.linger){ Z.splice(i,1); continue; } z.ll=z.linger; z.tk=0; }
    if(z.done && z.linger){ z.ll-=dt; z.tk-=dt;
      if(inZone(z,h)){ h.buffs.spd=0.55; h.buffs.spdT=Math.max(h.buffs.spdT||0,0.25); if(z.tk<=0){ z.tk=0.5; hurtHero(h,Math.round(campDmg(5)),0); } }
      if(z.ll<=0) Z.splice(i,1); }
  }
}
function drawZones(vis){
  const C=CAMP;
  for(const z of C.zones){
    if(!z.done){ const f=Math.min(1,z.t/z.delay);
      if(z.k==='c'){ if(!vis(z.x,z.y,z.r+20)) continue; ctx.fillStyle=rgba(TELE,0.08+0.2*f); ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,TAU); ctx.fill(); ctx.strokeStyle=rgba(TELE,0.9); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,TAU); ctx.stroke(); ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(z.x,z.y,Math.max(2,z.r*f),0,TAU); ctx.stroke(); }
      else { const L=Math.hypot(z.x1-z.x0,z.y1-z.y0), an=Math.atan2(z.y1-z.y0,z.x1-z.x0); laneRect(z.x0,z.y0,an,L,z.w,0.06+0.2*f,TELE); }
    } else if(z.linger && z.k==='c'){ if(!vis(z.x,z.y,z.r+20)) continue; ctx.globalAlpha=Math.min(0.4,z.ll*0.2); ctx.fillStyle=rgba(z.col,0.5); ctx.beginPath(); for(let k=0;k<6;k++){ const an=k/6*TAU+0.4; const px=z.x+Math.cos(an)*z.r, py=z.y+Math.sin(an)*z.r; if(k) ctx.lineTo(px,py); else ctx.moveTo(px,py); } ctx.closePath(); ctx.fill(); ctx.strokeStyle='rgba(224,246,255,.8)'; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1; }
  }
  for(const e of enemies) if(e.alive && (e.aiS||e.xS) && vis(e.x,e.y,400)) drawAiTele(e);
}

const BOSS_ATK={goblin:['WARBAND VOLLEY','RALLY THE WARBAND'],crypt:['SOUL TIDE','RISE AGAIN'],garrison:['LANCE VOLLEY',"MARSHAL'S ORDER"],frost:['FREEZING FLOOR','ICE SHARD FAN'],demon:['INFERNAL RAIN','HELLFIRE RING']};
function bossAttack(e,h,n){
  const th=e.bt, C=CAMP, rg=e.rage||1, dm=x=>Math.round(campDmg(x)*rg);
  const a=Math.atan2(h.y-e.y,h.x-e.x);

  const fan=(cnt,spread,spd,dmg,col,extra)=>{ for(let i=0;i<cnt;i++) proj(a+(cnt>1?(i/(cnt-1)-.5)*spread:0),spd,dmg,col,extra); };
  const ring=(cnt,spd,dmg,col,off)=>{ for(let i=0;i<cnt;i++) proj(off+i/cnt*TAU,spd,dmg,col); };
  const zc=(x,y,r,delay,dmg,col,extra)=>{ const p=clampPt(x,y); C.zones.push(Object.assign({k:'c',x:p.x,y:p.y,r,delay,t:0,dmg:dm(dmg),col,foe:false},extra||{})); };

// mt: meteor storm. Ground markers appear, then meteors crash down one after another on/around foes.
PRIM.mt=function(h,a,q,c){ const n=q.n||6, R=q.r||200, iv=q.iv||.1, delay=q.delay||.5, cc=col(q,c), r=q.r2||(q.d>=45?84:70);
  const foes=inCirc(h.x,h.y,R+60); BD.rays=Math.max(BD.rays,.25); BD.rayCol=cc;
  for(let i=0;i<n;i++){ const tgt=foes.length&&i%3!==2?foes[(Math.random()*foes.length)|0]:null;
    const px=tgt?tgt.x+(Math.random()-.5)*34:h.x+Math.cos(a+(Math.random()-.5)*2.4)*(70+Math.random()*R);
    const py=tgt?tgt.y+(Math.random()-.5)*34:h.y+Math.sin(a+(Math.random()-.5)*2.4)*(70+Math.random()*R); const P=clampPt(px,py);
    later(i*iv,()=>{ if(!h.alive) return; addPart({b6:'meteor',x:P.x,y:P.y,r,fall:.999,col:cc,sky:460,drift:140,t:delay,max:delay});
      later(delay,()=>{ if(!h.alive) return; const ex=explode(h,P.x,P.y,r,Q(q,{exd:q.d,up:q.up!=null?q.up:260,st:q.st||BURN}),c); addPart({bd:'flare',x:P.x,y:P.y,a:Math.random(),r:r*1.5,col:'#fff',t:.2,max:.2});
        addShake(7); BD.chroma=Math.max(BD.chroma,.16); if(!G.low) for(let k=0;k<5;k++) addPart({b6:'shard',x:P.x,y:P.y,vx:(Math.random()-.5)*120,vy:-50-Math.random()*70,g:260,rot:Math.random()*TAU,spin:(Math.random()-.5)*10,s:5+Math.random()*4,col:cc,t:.5,max:.5}); }); }); } };
// bm: laser beam fixed to the hero; optional sweep (radians over duration) and tick damage
PRIM.bm=function(h,a,q,c){ const dur=q.dur||.9, len=q.len||340, w=q.w||50, cc=col(q,c), sw=q.sweep||0, dir=q.dir||(Math.random()<.5?1:-1), a0=a-sw*.5*dir, ticks=Math.max(3,Math.round(dur/.07));
  h.iframe=Math.max(h.iframe,dur*.6); BD.rays=Math.max(BD.rays,dur); BD.rayCol=cc; BD.speed=Math.max(BD.speed,dur*.7); BD.chroma=Math.max(BD.chroma,.25); G.flashT=.1; G.flashCol=cc; addShake(10);
  addPart({b6:'beam',fol:h,a0,sw,dir,len,w,col:cc,t:dur,max:dur});
  for(let i=0;i<ticks;i++) later(i*(dur/ticks),()=>{ if(!h.alive) return; const an=a0+sw*(i/ticks)*dir; h.a=an; hitList(h,inLine(h.x,h.y,an,len,w),Q(q,{hs:i===ticks-1?.09:.008,up:i===ticks-1?(q.up!=null?q.up:260):40,kb:i===ticks-1?(q.kb||160):6}),c,h.x,h.y); if(!G.low&&i%2===0) dots(h.x+Math.cos(an)*len*Math.random(),h.y+Math.sin(an)*len*Math.random(),2,cc,120,.3); if(i%4===0) addShake(5); });
  later(dur,()=>{ if(!h.alive) return; const an=a0+sw*dir, ex=h.x+Math.cos(an)*len, ey=h.y+Math.sin(an)*len; addPart({bd:'flare',x:ex,y:ey,a:0,r:w*1.8,col:'#fff',t:.3,max:.3}); BD.whiteT=.18; }); };
// lt: sky lightning forks on nearby foes (big=1 draws wide bolts + white-out)
PRIM.lt=function(h,a,q,c){ const n=q.n||3, iv=q.iv||.09, cc=col(q,c), range=q.near||300, seen=new Set();
  for(let i=0;i<n;i++) later(i*iv,()=>{ if(!h.alive) return; let e=nearest(h.x,h.y,range,seen); if(e&&i<n-1&&Math.random()<.7) seen.add(e); const x=e?e.x+(Math.random()-.5)*22:h.x+Math.cos(a)*120+(Math.random()-.5)*90, y=e?e.y:h.y+Math.sin(a)*120+(Math.random()-.5)*90;
    const top=y-520, P=boltPath(x+(Math.random()-.5)*120,top,x,y,9,70), forks=[]; if(!G.low) for(let k=0;k<2;k++){ const s0=P[2+((Math.random()*4)|0)]; forks.push(boltPath(s0.x,s0.y,s0.x+(Math.random()-.5)*160,s0.y+120+Math.random()*100,5,40)); }
    addPart({b6:'bolt',pts:P,forks,w:q.big?16:9,col:cc,t:q.big?.32:.24,max:q.big?.32:.24}); addPart({shock:1,x,y,r0:6,r1:(q.r||60)+16,col:cc,t:.22,max:.22,lw:6}); addPart({bd:'flare',x,y,a:Math.random(),r:(q.r||60)*1.4,col:'#fff',t:.2,max:.2});
    hitList(h,inCirc(x,y,q.r||60),Q(q,{hs:.04,el:'Electric',up:q.up!=null?q.up:200}),c,x,y); addShake(q.big?7:4); if(q.big){ BD.whiteT=Math.max(BD.whiteT,.07); BD.chroma=Math.max(BD.chroma,.2); } dots(x,y,6,cc,220,.35); }); };
// sw: spectral swords orbit the hero (or foe cluster), hover, then plunge in unison onto foes
PRIM.sw=function(h,a,q,c){ const n=q.n||8, R=q.r||150, cc=col(q,c), delay=q.delay||.6, hover=.62, foes=inCirc(h.x,h.y,R+80), cx=h.x, cy=h.y;
  BD.rays=Math.max(BD.rays,.5); BD.rayCol=cc; const T=delay+.32; const plan=[];
  for(let i=0;i<n;i++){ const tgt=foes.length?foes[i%foes.length]:null; const tx=tgt?tgt.x+(Math.random()-.5)*20:cx+Math.cos(a+(i/n-.5)*2)*(80+Math.random()*R*.6), ty=tgt?tgt.y+(Math.random()-.5)*20:cy+Math.sin(a+(i/n-.5)*2)*(80+Math.random()*R*.6);
    plan.push({tx,ty}); addPart({b6:'sword',fol:h,cx,cy,an:i/n*TAU,rr:q.rain?R*(.4+Math.random()*.9):R*.55,alt:q.rain?150+Math.random()*120:56,tx,ty,hover,col:cc,t:T,max:T}); }
  later(delay,()=>{ if(!h.alive) return; G.flashT=.08; G.flashCol=cc; BD.chroma=Math.max(BD.chroma,.2); addShake(7); plan.forEach((P,i)=>later(i*.02,()=>{ addPart({shock:1,x:P.tx,y:P.ty,r0:4,r1:46,col:cc,t:.2,max:.2,lw:5}); addPart({bd:'flare',x:P.tx,y:P.ty,a:Math.random(),r:46,col:'#fff',t:.14,max:.14}); hitList(h,inCirc(P.tx,P.ty,q.hr||46),Q(q,{hs:.012,up:q.up!=null?q.up:140,el:q.elec?'Electric':q.el}),c,P.tx,P.ty); })); }); };
// gun: tracer barrage with muzzle flash, casings and impact sparks
PRIM.gun=function(h,a,q,c){ const n=q.n||5, iv=q.iv||.05, R=q.r||340, cc=col(q,c), spr=q.spr||.3;
  BD.speed=Math.max(BD.speed,n*iv*.8);
  for(let i=0;i<n;i++) later(i*iv,()=>{ if(!h.alive) return; const aa=a+(Math.random()-.5)*spr; const mx=h.x+Math.cos(aa)*18, my=h.y+Math.sin(aa)*18, ex=h.x+Math.cos(aa)*R, ey=h.y+Math.sin(aa)*R;
    addPart({b6:'tracer',x0:mx,y0:my,x1:ex,y1:ey,col:cc,t:.16,max:.16}); if(!G.low) addPart({b6:'shard',x:h.x,y:h.y-4,vx:Math.cos(aa+1.57)*60,vy:-30,g:200,rot:0,spin:12,s:3,col:'#ffd070',t:.35,max:.35});
    hitList(h,inLine(h.x,h.y,aa,R,q.w||10),Q(q,{hs:.006,up:q.up!=null?q.up:0,kb:q.kb!=null?q.kb:10,pierce:q.w?1:0}),c,h.x,h.y); if(i%3===0){ lunge(h,aa+Math.PI,6,.04); addShake(2); addKick(aa,2); } }); };
// shat: freeze foes in range then shatter them for crit damage and ice shards
PRIM.shat=function(h,a,q,c){ const R=q.r||170, cc=q.col||'#bfe8ff', T=inCirc(h.x,h.y,R); for(const e of T){ applyStatus(e,'freeze',.6); applyStatus(e,'stun',.6); } addPart({b6:'shatterring',fol:h,r:R,col:cc,t:.6,max:.6}); comboBanner('SHATTER',h.x,h.y-70,cc);
  later(.5,()=>{ if(!h.alive) return; const L=inCirc(h.x,h.y,R); G.flashT=.12; G.flashCol='#ffffff'; BD.chroma=.35; BD.inv=.07; addShake(10);
    for(const e of L){ if(!G.low) for(let k=0;k<7;k++) addPart({b6:'shard',x:e.x,y:e.y,vx:(Math.random()-.5)*240,vy:-80-Math.random()*120,g:340,rot:Math.random()*TAU,spin:(Math.random()-.5)*14,s:6+Math.random()*6,col:k%2?'#fff':cc,t:.6,max:.6}); addPart({bd:'flare',x:e.x,y:e.y,a:Math.random(),r:60,col:'#fff',t:.2,max:.2}); }
    addPart({shock:1,x:h.x,y:h.y,r0:10,r1:R*1.2,col:cc,t:.4,max:.4,lw:9}); hitList(h,L,Q(q,{hs:.12,up:q.up!=null?q.up:340,br:q.br||50,el:'Ice'}),c,h.x,h.y); }); };

/* ---- 4.6 hit hook: per-hit slash marks and a rank-style combo meter ---- */
const _hurt46=hurt;
hurt=function(e,dmg,a,o){ const r=_hurt46(e,dmg,a,o); o=o||{};
  if(r>0 && o.owner===player && o.kind!=='dot' && !G.low){ BD.rank=Math.min(1,BD.rank+.012+Math.min(.03,dmg/4000)); const cc=o.col||'#fff';
    addPart({b6:'hitslash',x:e.x+(Math.random()-.5)*10,y:e.y-e.z*.4+(Math.random()-.5)*10,a:Math.random()*TAU,len:20+Math.min(36,dmg*.3),w:7+Math.min(10,dmg*.08),col:cc,t:.16,max:.16}); }
  return r; };
/* ---- skill cut-ins get letterbox bars + speed lines ---- */
const _sc46=startCut;
startCut=function(h,t,s,sch){ _sc46(h,t,s,sch); BD.bars=1.2; BD.speed=Math.max(BD.speed,.9); BD.inv=.08; };

/* ---- 4.6 screen-space layer ---- */
const _fxS46=fxScreen;
fxScreen=function(){ _fxS46(); if(G.mode==='title') return;
  const dt=.016; BD.bars=Math.max(0,BD.bars-dt); BD.speed=Math.max(0,BD.speed-dt); BD.inv=Math.max(0,BD.inv-dt); BD.whiteT=Math.max(0,BD.whiteT-dt); BD.rank=Math.max(0,BD.rank-dt*(BD.hits>0?.02:.25));
  if(G.flashOn===false) return;
  if(BD.speed>0 && !G.low){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,'+Math.min(.55,BD.speed*.7)+')'; ctx.lineWidth=1.4; ctx.beginPath(); for(let i=0;i<34;i++){ const an=Math.random()*TAU, r0=Math.min(W,H)*(.32+Math.random()*.16), r1=r0+90+Math.random()*180; ctx.moveTo(W/2+Math.cos(an)*r0,H/2+Math.sin(an)*r0*.8); ctx.lineTo(W/2+Math.cos(an)*r1,H/2+Math.sin(an)*r1*.8); } ctx.stroke(); ctx.restore(); }
  if(BD.bars>0){ const k=Math.min(1,BD.bars*3,(1.2-BD.bars)*6+.1), hh=H*.11*k; ctx.save(); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,hh); ctx.fillRect(0,H-hh,W,hh); ctx.restore(); }
  if(BD.inv>0){ ctx.save(); ctx.globalCompositeOperation='difference'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  if(BD.whiteT>0){ ctx.save(); ctx.globalAlpha=Math.min(.85,BD.whiteT*5); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.restore(); }
};

boot();
requestAnimationFrame(frame);
})();
